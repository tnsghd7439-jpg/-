<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네이버 전담팀 원보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
  :root{
    --g900:#0f3d2c; --g800:#14513a; --g600:#1d7a52; --g500:#25935f; --g200:#c5e3d1; --g100:#e3f1e8; --g50:#f3f9f5;
    --paper:#ffffff; --ink:#13261d; --ink2:#4b5f55; --ink3:#86978e; --line:#d8e5dc;
    --warn:#c2410c; --warnbg:#fff3ea; --bad:#b42318; --badbg:#fdeceb; --blue:#2563a8; --bluebg:#e9f1fb; --teal:#0f766e;
    --font:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--g500);outline-offset:2px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  /* 머리 */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 18px;flex-wrap:wrap}
  .brand{font-size:27px;font-weight:900;letter-spacing:-.02em;color:var(--g900);border:3px solid var(--g900);border-radius:12px;padding:4px 18px 6px}
  .who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
  .who b{color:var(--ink)}
  .role{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--g100);color:var(--g800)}
  .linkbtn{background:none;border:none;color:var(--g600);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:2px}

  /* 탭 */
  .tabs{display:flex;flex-wrap:wrap;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line)}
  .tab{position:relative;border:2.5px solid var(--g900);background:#fff;color:var(--g900);border-radius:11px;padding:9px 20px;font-size:16px;font-weight:800;transition:background .12s}
  .tab:hover{background:var(--g50)}
  .tab.on{background:var(--g900);color:#fff}
  .tab.lead{border-style:dashed}
  .tab .n{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--warn);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}

  main{padding:26px 0 70px;min-height:60vh}
  h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
  h3{font-size:17px;font-weight:800;margin-bottom:10px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .head p{color:var(--ink2);font-size:14px;margin-top:2px}
  .sec{margin-top:30px}
  .muted{color:var(--ink3)} .small{font-size:13px}

  /* 버튼·입력 */
  .btn{border:1.5px solid var(--g900);background:#fff;color:var(--g900);border-radius:9px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap}
  .btn:hover{background:var(--g50)}
  .btn.pri{background:var(--g900);color:#fff}
  .btn.pri:hover{background:var(--g800)}
  .btn.ok{background:var(--g600);border-color:var(--g600);color:#fff}
  .btn.no{border-color:var(--bad);color:var(--bad)}
  .btn.ghost{border-color:var(--line);color:var(--ink2)}
  .btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-size:13.5px;font-weight:700;color:var(--ink2)}
  .chip.on{border-color:var(--g900);background:var(--g900);color:#fff}
  label.f{display:block;margin-bottom:12px}
  label.f span{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:4px}
  input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff}
  input:focus,select:focus,textarea:focus{border-color:var(--g600);outline:none}
  textarea{min-height:90px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

  /* 카드 */
  .card{border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;background:#fff}
  .card+.card{margin-top:10px}
  .cols>.card{margin-top:0}
  .card.hot{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
  .card.done{background:var(--g50)}
  .ct{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ct .t{font-weight:800;font-size:16px}
  .tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:6px;background:var(--g100);color:var(--g800);white-space:nowrap}
  .tag.warn{background:var(--warnbg);color:var(--warn)}
  .tag.bad{background:var(--badbg);color:var(--bad)}
  .tag.blue{background:var(--bluebg);color:var(--blue)}
  .tag.gray{background:#eef1ef;color:var(--ink2)}
  .meta{font-size:13px;color:var(--ink3);margin-top:3px}
  .body{white-space:pre-wrap;color:var(--ink2);margin-top:8px;font-size:14.5px}
  .bar{height:10px;border-radius:99px;background:var(--g100);overflow:hidden;margin:10px 0 6px;position:relative}
  .bar i{display:block;height:100%;background:var(--g600);border-radius:99px}
  .bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
  .kv{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
  .kv b{color:var(--ink);font-weight:800}
  details summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--g600);margin-top:8px}
  details[open] summary{margin-bottom:4px}
  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .empty{border:2px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--ink2)}
  .empty>b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

  /* 숫자 띠 */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border:2px solid var(--g900);border-radius:14px;overflow:hidden}
  .stat{padding:14px 18px;border-right:1px solid var(--line)}
  .stat:last-child{border-right:none}
  .stat .l{font-size:13px;color:var(--ink2);font-weight:700}
  .stat .v{font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--g900)}
  .stat .d{font-size:13px;font-weight:700}
  .up{color:var(--g600)} .down{color:var(--bad)}

  /* 표 */
  .tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  .tbl th{font-size:12.5px;color:var(--ink2);text-align:left;font-weight:700;padding:8px 10px;border-bottom:2px solid var(--g900);white-space:nowrap}
  .tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .tbl td.r,.tbl th.r{text-align:right}
  .tbl tr.warn td{background:var(--warnbg)}
  .scroll{overflow-x:auto}

  /* AHI */
  .ahi{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .ax{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
  .ax.warn{border-color:var(--warn);background:var(--warnbg)}
  .ax .top2{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink2)}
  .ax .nm{font-weight:800;font-size:15px;margin-top:2px}
  .ax .v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  .ax .h{font-size:12.5px;color:var(--ink3)}

  /* 캘린더 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);border:2px solid var(--g900);border-radius:14px;overflow:hidden}
  .cal .dow{background:var(--g900);color:#fff;font-size:13px;font-weight:700;text-align:center;padding:6px 0}
  .cal .day{min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;background:#fff;text-align:left;border-top:none;border-left:none;display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .cal .day:nth-child(7n){border-right:none}
  .cal .day.out{background:#fafcfb;color:var(--ink3)}
  .cal .day.today .dn{background:var(--g900);color:#fff;border-radius:99px;padding:0 7px}
  .cal .day.sel{box-shadow:inset 0 0 0 2.5px var(--g500)}
  .cal .dn{font-size:13px;font-weight:800;align-self:flex-start}
  .cal .dn.sun{color:var(--bad)}
  .ev{font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .ev.팀{background:var(--g100);color:var(--g800)} .ev.개인{background:#e2f4f1;color:var(--teal)}
  .ev.미팅{background:var(--bluebg);color:var(--blue)} .ev.프로모션{background:var(--warnbg);color:var(--warn)}
  .ev.마감{background:#eef1ef;color:var(--ink)}
  .ev.외근{background:#efe9fb;color:#5b3fa8} .ev.근태{background:#fdf0f4;color:#a8325b} .ev.매체{background:#fff1dc;color:#9a5b00}
  .ck{font-size:11.5px;font-weight:800;margin-top:auto}
  .ck .o{color:var(--g600)} .ck .x{color:var(--bad)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:10px 0}

  /* 가이드 */
  .guide{display:grid;grid-template-columns:220px 1fr;gap:22px}
  .mlist{display:flex;flex-direction:column;gap:6px}
  .mlist button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:700}
  .mlist button.on{border-color:var(--g900);background:var(--g900);color:#fff}
  .gbody{white-space:pre-wrap;font-size:14.5px;color:var(--ink2)}
  .gbody a{color:var(--g600)}

  /* 모달·알림 */
  .modal{position:fixed;inset:0;background:rgba(15,61,44,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
  .modal[hidden]{display:none}
  .sheet{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:22px 22px 18px;position:relative;border:2.5px solid var(--g900)}
  .sheet h3{font-size:19px;padding-right:30px}
  .close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:18px;line-height:1}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
  .pop{border-left:5px solid var(--warn);background:var(--warnbg);padding:10px 14px;border-radius:8px;margin-bottom:10px}
  .pop.naver{border-left-color:#03c75a;background:#eefbf3}
  .card.naver{border-color:#03c75a;box-shadow:inset 4px 0 0 #03c75a}
  .card.naver.hot{background:#f3fcf6}
  .tag.nv{background:#03c75a;color:#fff}
  .mtabs{display:flex;gap:8px;flex-wrap:wrap}
  .mtab{border:2px solid var(--line);background:#fff;border-radius:11px;padding:8px 16px;font-weight:800;font-size:15px;color:var(--ink2)}
  .mtab span{font-weight:600;color:var(--ink3);font-size:13px}
  .mtab b{margin-left:4px;background:var(--warn);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
  .mtab.on{border-color:var(--g900);background:var(--g900);color:#fff}
  .mtab.on span{color:#cfe5d8}
  .mtab.naver{border-color:#03c75a;color:#03a14a}
  .mtab.naver.on{background:#03c75a;border-color:#03c75a;color:#fff}
  .mtab.naver.on span{color:#e6fbef}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g900);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;z-index:60;max-width:90vw;display:none}
  .toast.err{background:var(--bad)}
  .loading{color:var(--ink3);padding:30px 0}
  .fatal{border:2px solid var(--bad);background:var(--badbg);border-radius:14px;padding:22px;color:var(--bad);font-weight:700}
  code{background:var(--g50);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px;word-break:break-all}

  @media (max-width:760px){
    .wrap{padding:0 16px}
    .brand{font-size:22px}
    .tab{padding:7px 13px;font-size:14.5px}
    .guide{grid-template-columns:1fr}
    .mlist{flex-direction:row;flex-wrap:wrap}
    .cal .day{min-height:64px;padding:3px}
    .cal .ev{display:none}
    .cal .day .dot{display:block}
    .grid2{grid-template-columns:1fr}
    .stat{border-right:none;border-bottom:1px solid var(--line)}
  }
  .dot{display:none;width:6px;height:6px;border-radius:99px;background:var(--g500)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">네이버 전담팀</div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="메뉴"></nav>
  <main id="view"><div class="loading">불러오는 중…</div></main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><button class="close" aria-label="닫기" onclick="closeModal()">×</button><div id="mbody"></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ───────── 공통 ───────── */
var B = null;            // bootstrap 데이터
var CUR = null;          // 현재 탭
var ST = { planWho: '', calMonth: '', calWho: '', calDay: '', perfWho: '', guideMedia: '', noticeFilter: '전체' };
var HOUR = 60 * 60 * 1000;

function call(action, payload) {
  return new Promise(function (res, rej) {
    google.script.run
      .withSuccessHandler(function (t) { var r = JSON.parse(t); r.ok ? res(r.data) : rej(new Error(r.error)); })
      .withFailureHandler(function (e) { rej(e); })
      .api(action, payload || {});
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function isLead() { return B && B.me.role === 'lead'; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, err ? 5000 : 2200); }
function fail(e) { toast(e && e.message ? e.message : String(e), true); }
function openModal(html) { $('mbody').innerHTML = html; $('modal').hidden = false; var f = $('mbody').querySelector('input,select,textarea,button'); if (f) f.focus(); }
function closeModal() { $('modal').hidden = true; $('mbody').innerHTML = ''; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });
function val(id) { var el = $(id); return el ? el.value : ''; }
function opts(list, cur) { return list.map(function (o) { var v = typeof o === 'string' ? o : o.v, l = typeof o === 'string' ? o : o.l; return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join(''); }

function won(n) {
  n = Math.round(Number(n) || 0); var s = n < 0 ? '-' : ''; n = Math.abs(n);
  if (n >= 1e8) { var man = Math.round((n % 1e8) / 1e4); return s + Math.floor(n / 1e8) + '억' + (man ? ' ' + man.toLocaleString() + '만' : ''); }
  if (n >= 1e4) return s + Math.round(n / 1e4).toLocaleString() + '만';
  return s + n.toLocaleString() + '원';
}
function num(n) { n = Number(n) || 0; return Number.isInteger(n) ? n.toLocaleString() : (Math.round(n * 10) / 10).toLocaleString(); }
function amt(n, unit) { return unit === '원' ? won(n) : num(n) + (unit || ''); }
function chg(cur, prev) {
  if (!prev) return '<span class="muted">비교 없음</span>';
  var p = (cur / prev - 1) * 100, c = p >= 0 ? 'up' : 'down';
  return '<span class="' + c + '">' + (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toFixed(1) + '%</span>';
}
function md(s) { return s ? Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)) : ''; }
function addDays(s, n) { var a = s.split('-').map(Number); var d = new Date(Date.UTC(a[0], a[1] - 1, a[2] + n)); return d.toISOString().slice(0, 10); }
function addMonths(m, n) { var a = m.split('-').map(Number); return new Date(Date.UTC(a[0], a[1] - 1 + n, 1)).toISOString().slice(0, 7); }
function linkify(s) { return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function memberOpts(cur, withAll) { var l = withAll ? [{ v: '', l: '팀원 전체' }] : []; B.members.forEach(function (m) { l.push({ v: m.email, l: m.name + (m.role === 'lead' ? ' (팀장)' : '') }); }); return opts(l, cur); }

/* ───────── 시작 ───────── */
function start() {
  call('bootstrap').then(function (d) {
    B = d;
    $('who').innerHTML = '<span><b>' + esc(d.me.name) + '</b> 님</span><span class="role">' + (isLead() ? '팀장' : '팀원') + '</span>'
      + '<span class="muted small">' + esc(d.today) + '</span><button class="linkbtn" onclick="alertSetup()">알리미 연결</button>';
    drawTabs();
    google.script.url.getLocation(function (loc) {
      var want = loc.parameter && loc.parameter.tab;
      var first = (want && B.tabs.some(function (t) { return t.id === want; })) ? want : (store('ob-tab') || B.tabs[0].id);
      if (!B.tabs.some(function (t) { return t.id === first; })) first = B.tabs[0].id;
      go(first);
      nudge(true);
    });
    setInterval(function () { nudge(false); }, HOUR);
  }).catch(function (e) {
    $('view').innerHTML = '<div class="fatal">' + esc(e.message || e) + '</div>';
  });
}

function drawTabs() {
  var b = B.badges || {};
  var cnt = { notice: b.unread, plan: isLead() ? (b.pending || 0) + (b.talk || 0) : b.todo };
  $('tabs').innerHTML = B.tabs.map(function (t) {
    var n = cnt[t.id];
    return '<button class="tab' + (t.id === CUR ? ' on' : '') + (t.lead ? ' lead' : '') + '" onclick="go(\'' + t.id + '\')"' + (t.lead ? ' title="팀장만 보이는 탭"' : '') + '>'
      + esc(t.name) + (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }).join('');
}

function go(id) {
  CUR = id; store('ob-tab', id); drawTabs();
  $('view').innerHTML = '<div class="loading">불러오는 중…</div>';
  ({ perf: viewPerf, plan: viewPlan, notice: viewNotice, solution: viewSolution, guide: viewGuide, calendar: viewCalendar, admin: viewAdmin }[id] || viewPlan)();
}
function refreshBadges() { return call('badges').then(function (b) { B.badges = b; drawTabs(); return b; }); }

/** 보드를 열어둔 동안: 미확인 공지는 1시간마다, 오늘 할 일은 하루 한 번 팝업 */
function nudge(first) {
  refreshBadges().then(function (b) {
    if (b.unread) return noticePopup();
    if (first && b.todo && store('ob-todo') !== B.today) { store('ob-todo', B.today); todoPopup(); }
  }).catch(function () {});
}

/* ───────── 공지사항 ───────── */
function noticePopup() {
  Promise.all([call('noticeList'), call('mediaNoticeList')]).then(function (r) {
    var un = r[0].filter(function (n) { return !n.read; });
    var mun = r[1].filter(function (n) { return n.needAck && !n.read; });
    var total = un.length + mun.length;
    if (!total || !$('modal').hidden) return;
    openModal('<h3>확인하지 않은 공지가 ' + total + '건 있어요</h3><p class="muted small" style="margin:4px 0 12px">확인을 누르기 전까지 1시간마다 다시 알려드려요.</p>'
      + un.map(function (n) {
        return '<div class="pop"><div class="ct"><span class="tag' + (n.type === '회사 공지' ? ' blue' : '') + '">' + esc(n.type) + '</span>' + (n.important ? '<span class="tag bad">중요</span>' : '')

function accTable(title, list) {
  return '<div>' + (title ? '<h3 class="small muted">' + title + '</h3>' : '') + '<div class="scroll"><table class="tbl"><tr><th>광고주</th><th class="r">이번 달</th><th class="r">지난달 같은 기간</th><th class="r">증감</th></tr>'
    + (list.length ? list.map(function (a) { return '<tr><td>' + esc(a.name) + ' <span class="muted small">' + esc(a.media) + '</span></td><td class="r">' + won(a.mtd) + '</td><td class="r">' + won(a.prevMtd) + '</td><td class="r">' + chg(a.mtd, a.prevMtd) + '</td></tr>'; }).join('') : '<tr><td colspan="4" class="muted">없음</td></tr>')
    + '</table></div></div>';
}
function trendSvg(t) {
  var max = Math.max.apply(null, t.map(function (x) { return x.amt; }).concat([1]));
  var W = 900, H = 150, bw = W / t.length;
  var bars = t.map(function (x, i) {
    var h = Math.max(1, x.amt / max * (H - 24));
    var we = new Date(x.date + 'T00:00:00Z').getUTCDay(); we = we === 0 || we === 6;
    return '<g><title>' + x.date + ' ' + won(x.amt) + '</title><rect x="' + (i * bw + 2) + '" y="' + (H - 18 - h) + '" width="' + (bw - 4) + '" height="' + h + '" rx="3" fill="' + (i === t.length - 1 ? '#0f3d2c' : (we ? '#c5e3d1' : '#25935f')) + '"/>'
      + (i % 5 === 4 || i === t.length - 1 ? '<text x="' + (i * bw + bw / 2) + '" y="' + (H - 3) + '" font-size="11" text-anchor="middle" fill="#4b5f55">' + md(x.date) + '</text>' : '') + '</g>';
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="최근 30일 일별 매출 막대그래프">' + bars + '</svg><p class="muted small">연한 막대는 주말, 진한 막대는 가장 최근 날짜입니다.</p>';
}
function ahiBlock(a) {
  var warns = a.metrics.filter(function (m) { return m.warn; });
  var h = '<div class="sec"><h3>AHI 건강 신호 <span class="muted small">' + Number(a.month.slice(5)) + '월 마감 기준 · ' + Number(a.prevMonth.slice(5)) + '월과 비교</span></h3>'
    + '<p class="muted small" style="margin:-6px 0 12px">점수 구간표 없이, AHI를 만드는 원재료 지표가 전월보다 나빠졌는지만 봅니다. 주황색 칸이 먼저 챙길 곳이고, 비중이 큰 축부터 보여줍니다.</p>';
  if (warns.length) h += '<div class="pop"><b>' + warns.map(function (m) { return m.axis + '·' + m.label; }).join(', ') + '</b> 이(가) 떨어지고 있어요. AHI가 내려갈 수 있는 신호입니다.</div>';
  h += '<div class="ahi">' + a.metrics.map(function (m) {
    var v = m.cur === null ? '<span class="muted" style="font-size:15px">계산 불가</span>' : num(m.cur) + '<span style="font-size:14px">' + m.unit + '</span>';
    var dl = m.delta === null ? '' : (function () { var good = m.good === 'up' ? m.delta >= 0 : m.delta <= 0; return '<span class="' + (good ? 'up' : 'down') + '">' + (m.delta >= 0 ? '▲' : '▼') + ' ' + Math.abs(m.delta) + m.deltaUnit + '</span>'; })();
    return '<div class="ax' + (m.warn ? ' warn' : '') + '"><div class="top2"><span>' + m.axis + ' 축 · 비중 ' + m.weight + '%</span>' + (m.warn ? '<span class="tag warn">주의</span>' : '') + '</div>'
      + '<div class="nm">' + m.label + '</div><div class="row"><span class="v">' + v + '</span>' + dl + '</div><div class="h">' + esc(m.note || m.hint) + '</div></div>';
  }).join('') + '</div>';
  if (a.lost.length) h += '<details><summary>지난달엔 집행했는데 이번 달 멈춘 계정 ' + a.lost.length + '곳</summary><table class="tbl small">' + a.lost.map(function (l) { return '<tr><td>' + esc(l.name) + '</td><td>' + esc(l.media) + '</td><td class="r">' + won(l.prev) + '</td></tr>'; }).join('') + '</table></details>';
  h += '<p class="muted small" style="margin-top:8px">이력이 3~6개월 이상 쌓여야 계산되는 지표가 있습니다. 데이터 시작: ' + esc(a.dataStart) + '</p></div>';
  return h;
}

  call('teamStats', { month: month }).then(function (d) {
    var h = '<div class="head"><div><h2>팀 현황</h2><p>팀장만 보는 화면입니다. 달성과 실패가 어디에 몰리는지 보고 팀원별로 관리 방식을 정하세요.</p></div>'
      + '<div class="row"><input type="month" style="width:auto" value="' + month + '" onchange="ST.adminMonth=this.value;viewAdmin()"></div></div>'
      + '<div class="scroll"><table class="tbl"><tr><th>팀원</th><th class="r">달성</th><th class="r">실패</th><th class="r">달성 비율</th><th class="r">소통 대기</th><th class="r">승인 대기</th><th class="r">진행 목표</th><th class="r">미확인 공지</th><th>마지막 체크</th><th>알리미</th><th></th></tr>'
      + d.members.map(function (m) {
        var hot = m.rate !== null && m.rate < 60;
        return '<tr' + (hot ? ' class="warn"' : '') + '><td><b>' + esc(m.name) + '</b></td><td class="r up">' + m.ok + '</td><td class="r down">' + m.fail + '</td><td class="r">' + (m.rate === null ? '-' : m.rate + '%') + '</td>'
          + '<td class="r">' + (m.talkPending || '') + '</td><td class="r">' + (m.pending || '') + '</td><td class="r">' + m.active + '</td><td class="r">' + (m.unread ? '<span class="down">' + m.unread + '</span>' : '0') + '</td>'
          + '<td>' + (m.lastCheck ? md(m.lastCheck) : '<span class="muted">없음</span>') + '</td><td>' + (m.hasAlert ? '<span class="tag">연결</span>' : '<span class="tag gray">미연결</span>') + '</td>'
          + '<td><button class="btn sm ghost" onclick="evalForm(\'' + m.email + '\')">평가자료</button></td></tr>';
      }).join('') + '</table></div>'
      + '<p class="muted small" style="margin-top:8px">달성 비율이 60% 미만이면 주황색으로 표시합니다. 팀원 추가·삭제와 담당자명은 원보드 시트의 <code>팀원</code> 탭에서 바꿉니다.</p>'
      + '<div class="sec"><h3>팀장 전용 메뉴 늘리기</h3><p class="muted small">관리자 회의록 요약 같은 팀장 전용 탭은 코드의 <code>TABS</code> 목록에 한 줄을 추가하면 이 탭처럼 팀장에게만 보입니다.</p></div>';
    $('view').innerHTML = h;
  }).catch(fail);
}

/* ───────── 알리미 연결 ───────── */
function alertSetup(renew) {
  call('alertCode', { renew: !!renew }).then(function (d) {
    openModal('<h3>원보드 알리미 연결</h3><p class="muted small" style="margin:6px 0 12px">알리미(크롬 확장)를 설치하면 보드 창을 닫아도, 크롬이 켜져 있는 동안 공지 미확인 알림이 1시간마다, 오늘 할 일 알림이 아침에 뜹니다.</p>'
      + '<ol class="small" style="padding-left:18px;color:var(--ink2)"><li>팀장에게 받은 알리미 폴더를 크롬 <code>chrome://extensions</code> 에서 <b>압축해제된 확장 프로그램 로드</b>로 설치</li><li>알리미 아이콘 → <b>연결 코드</b>에 아래 코드를 붙여넣고 저장</li></ol>'
      + '<label class="f" style="margin-top:12px"><span>내 연결 코드 (다른 사람에게 주지 마세요)</span><input type="text" id="a_code" readonly value="' + esc(d.connect) + '" onclick="this.select()"></label>'
      + '<div class="actions"><button class="btn ghost" onclick="if(confirm(\'새 코드를 만들면 기존 연결은 끊깁니다. 계속할까요?\'))alertSetup(true)">새 코드 만들기</button><button class="btn pri" onclick="copyCode()">코드 복사</button></div>');
  }).catch(fail);
}
function copyCode() { var i = $('a_code'); i.select(); try { document.execCommand('copy'); toast('복사했어요'); } catch (e) { toast('직접 선택해서 복사하세요', true); } }

start();
</script>
</body>
</html>
