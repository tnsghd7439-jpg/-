<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네이버 전담팀 원보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
  :root{
    --g900:#0f3d2c; --g800:#14513a; --g600:#1d7a52; --g500:#25935f; --g200:#c5e3d1; --g100:#e3f1e8; --g50:#f3f9f5;
    --paper:#ffffff; --ink:#13261d; --ink2:#4b5f55; --ink3:#86978e; --line:#d8e5dc;
    --warn:#c2410c; --warnbg:#fff3ea; --bad:#b42318; --badbg:#fdeceb; --blue:#2563a8; --bluebg:#e9f1fb; --teal:#0f766e;
    --font:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--g500);outline-offset:2px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  /* 머리 */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 18px;flex-wrap:wrap}
  .brand{font-size:27px;font-weight:900;letter-spacing:-.02em;color:var(--g900);border:3px solid var(--g900);border-radius:12px;padding:4px 18px 6px}
  .who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
  .who b{color:var(--ink)}
  .role{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--g100);color:var(--g800)}
  .linkbtn{background:none;border:none;color:var(--g600);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:2px}

  /* 탭 */
  .tabs{display:flex;flex-wrap:wrap;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line)}
  .tab{position:relative;border:2.5px solid var(--g900);background:#fff;color:var(--g900);border-radius:11px;padding:9px 20px;font-size:16px;font-weight:800;transition:background .12s}
  .tab:hover{background:var(--g50)}
  .tab.on{background:var(--g900);color:#fff}
  .tab.lead{border-style:dashed}
  .tab .n{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--warn);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}

  main{padding:26px 0 70px;min-height:60vh}
  h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
  h3{font-size:17px;font-weight:800;margin-bottom:10px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .head p{color:var(--ink2);font-size:14px;margin-top:2px}
  .sec{margin-top:30px}
  .muted{color:var(--ink3)} .small{font-size:13px}

  /* 버튼·입력 */
  .btn{border:1.5px solid var(--g900);background:#fff;color:var(--g900);border-radius:9px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap}
  .btn:hover{background:var(--g50)}
  .btn.pri{background:var(--g900);color:#fff}
  .btn.pri:hover{background:var(--g800)}
  .btn.ok{background:var(--g600);border-color:var(--g600);color:#fff}
  .btn.no{border-color:var(--bad);color:var(--bad)}
  .btn.ghost{border-color:var(--line);color:var(--ink2)}
  .btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-size:13.5px;font-weight:700;color:var(--ink2)}
  .chip.on{border-color:var(--g900);background:var(--g900);color:#fff}
  label.f{display:block;margin-bottom:12px}
  label.f span{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:4px}
  input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff}
  input:focus,select:focus,textarea:focus{border-color:var(--g600);outline:none}
  textarea{min-height:90px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

  /* 카드 */
  .card{border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;background:#fff}
  .card+.card{margin-top:10px}
  .cols>.card{margin-top:0}
  .card.hot{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
  .card.done{background:var(--g50)}
  .ct{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ct .t{font-weight:800;font-size:16px}
  .tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:6px;background:var(--g100);color:var(--g800);white-space:nowrap}
  .tag.warn{background:var(--warnbg);color:var(--warn)}
  .tag.bad{background:var(--badbg);color:var(--bad)}
  .tag.blue{background:var(--bluebg);color:var(--blue)}
  .tag.gray{background:#eef1ef;color:var(--ink2)}
  .meta{font-size:13px;color:var(--ink3);margin-top:3px}
  .body{white-space:pre-wrap;color:var(--ink2);margin-top:8px;font-size:14.5px}
  .bar{height:10px;border-radius:99px;background:var(--g100);overflow:hidden;margin:10px 0 6px;position:relative}
  .bar i{display:block;height:100%;background:var(--g600);border-radius:99px}
  .bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
  .kv{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
  .kv b{color:var(--ink);font-weight:800}
  details summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--g600);margin-top:8px}
  details[open] summary{margin-bottom:4px}
  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .empty{border:2px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--ink2)}
  .empty>b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

  /* 숫자 띠 */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border:2px solid var(--g900);border-radius:14px;overflow:hidden}
  .stat{padding:14px 18px;border-right:1px solid var(--line)}
  .stat:last-child{border-right:none}
  .stat .l{font-size:13px;color:var(--ink2);font-weight:700}
  .stat .v{font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--g900)}
  .stat .d{font-size:13px;font-weight:700}
  .up{color:var(--g600)} .down{color:var(--bad)}

  /* 표 */
  .tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  .tbl th{font-size:12.5px;color:var(--ink2);text-align:left;font-weight:700;padding:8px 10px;border-bottom:2px solid var(--g900);white-space:nowrap}
  .tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .tbl td.r,.tbl th.r{text-align:right}
  .tbl tr.warn td{background:var(--warnbg)}
  .scroll{overflow-x:auto}

  /* AHI */
  .ahi{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .ax{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
  .ax.warn{border-color:var(--warn);background:var(--warnbg)}
  .ax .top2{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink2)}
  .ax .nm{font-weight:800;font-size:15px;margin-top:2px}
  .ax .v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  .ax .h{font-size:12.5px;color:var(--ink3)}

  /* 캘린더 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);border:2px solid var(--g900);border-radius:14px;overflow:hidden}
  .cal .dow{background:var(--g900);color:#fff;font-size:13px;font-weight:700;text-align:center;padding:6px 0}
  .cal .day{min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;background:#fff;text-align:left;border-top:none;border-left:none;display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .cal .day:nth-child(7n){border-right:none}
  .cal .day.out{background:#fafcfb;color:var(--ink3)}
  .cal .day.today .dn{background:var(--g900);color:#fff;border-radius:99px;padding:0 7px}
  .cal .day.sel{box-shadow:inset 0 0 0 2.5px var(--g500)}
  .cal .dn{font-size:13px;font-weight:800;align-self:flex-start}
  .cal .dn.sun{color:var(--bad)}
  .ev{font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .ev.팀{background:var(--g100);color:var(--g800)} .ev.개인{background:#e2f4f1;color:var(--teal)}
  .ev.미팅{background:var(--bluebg);color:var(--blue)} .ev.프로모션{background:var(--warnbg);color:var(--warn)}
  .ev.마감{background:#eef1ef;color:var(--ink)}
  .ev.연락{background:#e2f0ff;color:#1d5fa8}
  .todo-row{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:14px;gap:8px}
  .todo-row.late{border-color:var(--bad);background:var(--badbg)}
  .shot{margin:0 0 18px}.shot figcaption{font-size:13px;line-height:1.6;margin-bottom:6px}.shot .tip{color:var(--warn);margin-top:2px}
  .shotph{padding:18px;border:1px dashed var(--line);border-radius:8px;color:var(--ink3);font-size:13px}
  .gbody .shot{margin:10px 0 14px;white-space:normal}
  .shot img{width:100%;border:1px solid var(--line);border-radius:8px;display:block}
  .lead-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .lead-row:first-of-type{border-top:none}
  .lead-row .lb{flex:1;min-width:0}
  .lead-row .when{min-width:96px;text-align:right;font-size:13px}
  .lead-row.late .when b{color:var(--bad)}
  .lead-row.flash{background:#fff7e6}
  .grade{display:inline-block;width:24px;height:24px;border-radius:6px;text-align:center;line-height:24px;font-weight:700;font-size:13px;color:#fff;background:#94a3b8}
  .grade.g상{background:var(--bad)}.grade.g중{background:var(--warn)}.grade.g하{background:var(--blue)}
  .task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
  .task:first-of-type{border-top:none}
  .task input{margin-top:4px;width:18px;height:18px;accent-color:var(--g600)}
  .task .tb{flex:1;min-width:0}
  .task.done .tb>div:first-child{text-decoration:line-through;color:var(--ink3)}
  .task.late .tb>div:first-child{color:var(--bad)}
  .dotk{width:8px;height:8px;border-radius:99px;background:var(--g200);margin-top:7px}
  .tasks{gap:12px}
  .tasks>.card{margin-top:0}
  .ev.외근{background:#efe9fb;color:#5b3fa8} .ev.근태{background:#fdf0f4;color:#a8325b} .ev.매체{background:#fff1dc;color:#9a5b00}
  .ck{font-size:11.5px;font-weight:800;margin-top:auto}
  .ck .o{color:var(--g600)} .ck .x{color:var(--bad)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:10px 0}

  /* 가이드 */
  .guide{display:grid;grid-template-columns:220px 1fr;gap:22px}
  .mlist{display:flex;flex-direction:column;gap:6px}
  .mlist button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:700}
  .mlist button.on{border-color:var(--g900);background:var(--g900);color:#fff}
  .gbody{white-space:pre-wrap;font-size:14.5px;color:var(--ink2)}
  .gbody a{color:var(--g600)}

  /* 모달·알림 */
  .modal{position:fixed;inset:0;background:rgba(15,61,44,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
  .modal[hidden]{display:none}
  .sheet{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:22px 22px 18px;position:relative;border:2.5px solid var(--g900)}
  .sheet h3{font-size:19px;padding-right:30px}
  .close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:18px;line-height:1}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
  .pop{border-left:5px solid var(--warn);background:var(--warnbg);padding:10px 14px;border-radius:8px;margin-bottom:10px}
  .pop.naver{border-left-color:#03c75a;background:#eefbf3}
  .card.naver{border-color:#03c75a;box-shadow:inset 4px 0 0 #03c75a}
  .card.naver.hot{background:#f3fcf6}
  .tag.nv{background:#03c75a;color:#fff}
  .mtabs{display:flex;gap:8px;flex-wrap:wrap}
  .mtab{border:2px solid var(--line);background:#fff;border-radius:11px;padding:8px 16px;font-weight:800;font-size:15px;color:var(--ink2)}
  .mtab span{font-weight:600;color:var(--ink3);font-size:13px}
  .mtab b{margin-left:4px;background:var(--warn);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
  .mtab.on{border-color:var(--g900);background:var(--g900);color:#fff}
  .mtab.on span{color:#cfe5d8}
  .mtab.naver{border-color:#03c75a;color:#03a14a}
  .mtab.naver.on{background:#03c75a;border-color:#03c75a;color:#fff}
  .mtab.naver.on span{color:#e6fbef}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g900);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;z-index:60;max-width:90vw;display:none}
  .toast.err{background:var(--bad)}
  .loading{color:var(--ink3);padding:30px 0}
  .fatal{border:2px solid var(--bad);background:var(--badbg);border-radius:14px;padding:22px;color:var(--bad);font-weight:700}
  code{background:var(--g50);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px;word-break:break-all}

  @media (max-width:760px){
    .wrap{padding:0 16px}
    .brand{font-size:22px}
    .tab{padding:7px 13px;font-size:14.5px}
    .guide{grid-template-columns:1fr}
    .mlist{flex-direction:row;flex-wrap:wrap}
    .cal .day{min-height:64px;padding:3px}
    .cal .ev{display:none}
    .cal .day .dot{display:block}
    .grid2{grid-template-columns:1fr}
    .stat{border-right:none;border-bottom:1px solid var(--line)}
  }
  .dot{display:none;width:6px;height:6px;border-radius:99px;background:var(--g500)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">네이버 전담팀</div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="메뉴"></nav>
  <main id="view"><div class="loading">불러오는 중…</div></main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><button class="close" aria-label="닫기" onclick="closeModal()">×</button><div id="mbody"></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ───────── 공통 ───────── */
var B = null;            // bootstrap 데이터
var CUR = null;          // 현재 탭
var ST = { taskWho: '', salesGrade: '전체', salesDue: '전체', salesOpen: true, planWho: '', calMonth: '', calWho: '', calDay: '', perfWho: '', guideMedia: '', noticeFilter: '전체' };
var HOUR = 60 * 60 * 1000;

function call(action, payload) {
  return new Promise(function (res, rej) {
    google.script.run
      .withSuccessHandler(function (t) { var r = JSON.parse(t); r.ok ? res(r.data) : rej(new Error(r.error)); })
      .withFailureHandler(function (e) { rej(e); })
      .api(action, payload || {});
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function isLead() { return B && B.me.role === 'lead'; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, err ? 5000 : 2200); }
function fail(e) { toast(e && e.message ? e.message : String(e), true); }
function openModal(html, wide) { $('modal').querySelector('.sheet').style.maxWidth = wide ? '980px' : ''; $('mbody').innerHTML = html; $('modal').hidden = false; var f = $('mbody').querySelector('input,select,textarea,button'); if (f) f.focus(); }
function closeModal() { $('modal').hidden = true; $('mbody').innerHTML = ''; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });
function val(id) { var el = $(id); return el ? el.value : ''; }
function opts(list, cur) { return list.map(function (o) { var v = typeof o === 'string' ? o : o.v, l = typeof o === 'string' ? o : o.l; return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join(''); }

function won(n) {
  n = Math.round(Number(n) || 0); var s = n < 0 ? '-' : ''; n = Math.abs(n);
  if (n >= 1e8) { var man = Math.round((n % 1e8) / 1e4); return s + Math.floor(n / 1e8) + '억' + (man ? ' ' + man.toLocaleString() + '만' : ''); }
  if (n >= 1e4) return s + Math.round(n / 1e4).toLocaleString() + '만';
  return s + n.toLocaleString() + '원';
}
function num(n) { n = Number(n) || 0; return Number.isInteger(n) ? n.toLocaleString() : (Math.round(n * 10) / 10).toLocaleString(); }
function amt(n, unit) { return unit === '원' ? won(n) : num(n) + (unit || ''); }
function chg(cur, prev) {
  if (!prev) return '<span class="muted">비교 없음</span>';
  var p = (cur / prev - 1) * 100, c = p >= 0 ? 'up' : 'down';
  return '<span class="' + c + '">' + (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toFixed(1) + '%</span>';
}
function md(s) { return s ? Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)) : ''; }
function addDays(s, n) { var a = s.split('-').map(Number); var d = new Date(Date.UTC(a[0], a[1] - 1, a[2] + n)); return d.toISOString().slice(0, 10); }
function addMonths(m, n) { var a = m.split('-').map(Number); return new Date(Date.UTC(a[0], a[1] - 1 + n, 1)).toISOString().slice(0, 7); }
function linkify(s) { return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function memberOpts(cur, withAll) { var l = withAll ? [{ v: '', l: '팀원 전체' }] : []; B.members.forEach(function (m) { l.push({ v: m.email, l: m.name + (m.role === 'lead' ? ' (팀장)' : '') }); }); return opts(l, cur); }

/* ───────── 시작 ───────── */
function start() {
  call('bootstrap').then(function (d) {
    B = d;
    $('who').innerHTML = '<span><b>' + esc(d.me.name) + '</b> 님</span><span class="role">' + (isLead() ? '팀장' : '팀원') + '</span>'
      + '<span class="muted small">' + esc(d.today) + '</span><button class="linkbtn" onclick="alertSetup()">알리미 연결</button>';
    drawTabs();
    google.script.url.getLocation(function (loc) {
      var want = loc.parameter && loc.parameter.tab;
      if (loc.parameter && loc.parameter.lead) { ST.openLead = loc.parameter.lead; ST.salesOpen = false; want = 'sales'; }
      var first = (want && B.tabs.some(function (t) { return t.id === want; })) ? want : (store('ob-tab') || B.tabs[0].id);
      if (!B.tabs.some(function (t) { return t.id === first; })) first = B.tabs[0].id;
      go(first);
      nudge(true);
    });
    setInterval(function () { nudge(false); }, HOUR);
  }).catch(function (e) {
    $('view').innerHTML = '<div class="fatal">' + esc(e.message || e) + '</div>';
  });
}

function drawTabs() {
  var b = B.badges || {};
  var cnt = { notice: b.unread, plan: isLead() ? (b.pending || 0) + (b.talk || 0) : 0, task: b.todo || 0, sales: b.calls };
  $('tabs').innerHTML = B.tabs.map(function (t) {
    var n = cnt[t.id];
    return '<button class="tab' + (t.id === CUR ? ' on' : '') + (t.lead ? ' lead' : '') + '" onclick="go(\'' + t.id + '\')"' + (t.lead ? ' title="팀장만 보이는 탭"' : '') + '>'
      + esc(t.name) + (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }).join('');
}

function go(id) {
  CUR = id; store('ob-tab', id); drawTabs();
  $('view').innerHTML = '<div class="loading">불러오는 중…</div>';
  ({ perf: viewPerf, check: viewCheck, plan: viewPlan, sales: viewSales, task: viewTask, notice: viewNotice, solution: viewSolution, guide: viewGuide, calendar: viewCalendar, admin: viewAdmin }[id] || viewPlan)();
}
function refreshBadges() { return call('badges').then(function (b) { B.badges = b; drawTabs(); return b; }); }

/** 보드를 열어둔 동안: 미확인 공지는 1시간마다, 오늘 할 일은 하루 한 번 팝업 */
function nudge(first) {
  (first ? Promise.resolve(B.badges) : refreshBadges()).then(function (b) {
    if (b.unread) return noticePopup();
    if (first && (b.todo || b.calls) && store('ob-todo') !== B.today) { store('ob-todo', B.today); todayPopup(); }
  }).catch(function () {});
}

/* ───────── 오늘 묶음 (오늘 전화할 곳 + 오늘 할일 + 오늘 목표) ───────── */
function todayPopup() {
  call('today').then(function (t) {
    var goals = t.goals.filter(function (g) { return !g.checked; });
    if ((!t.calls.length && !t.tasks.length && !goals.length) || !$('modal').hidden) return;
    openModal('<h3>오늘은 이것부터 해요</h3><p class="muted small" style="margin:4px 0 12px">' + esc(B.today) + ' · 끝낸 것은 체크해 주세요.</p>'
      + todayBody(t, goals) + '<div class="actions"><button class="btn ghost" onclick="closeModal();go(\'sales\')">영업노트</button><button class="btn ghost" onclick="closeModal();go(\'plan\')">액션플랜</button><button class="btn pri" onclick="closeModal();go(\'task\')">할일 열기</button></div>');
  }).catch(function () {});
}
function todayBody(t, goals) {
  var h = '';
  if (t.calls.length) h += '<h3 class="small" style="margin:6px 0">📞 오늘 연락할 곳 ' + t.calls.length + '곳</h3>' + t.calls.map(function (c) {
    return '<div class="todo-row' + (c.overdue ? ' late' : '') + '"><b>' + esc(c.at.slice(11, 16) || '시간 미정') + '</b> ' + esc(c.company)
      + (c.overdue ? ' <span class="tag bad">지남</span>' : '') + (c.memo ? '<div class="muted small">' + esc(c.memo) + '</div>' : '')
      + '<div class="row" style="margin-top:4px"><button class="btn ok sm" onclick="closeModal();openLead(\'' + c.id + '\')">영업노트에서 보기</button>'
      + (c.phone ? '<a class="btn ghost sm" href="tel:' + esc(c.phone) + '">' + esc(c.phone) + '</a>' : '') + '</div></div>';
  }).join('');
  if (t.tasks.length) h += '<h3 class="small" style="margin:12px 0 6px">✅ 오늘 할일 ' + t.tasks.length + '개</h3>' + t.tasks.map(function (x) {
    return '<label class="todo-row row"><input type="checkbox" onchange="taskDone(\'' + x.id + '\',this.checked,true)"> <span class="tag ' + (x.kind === '영업' ? 'blue' : 'gray') + '">' + esc(x.kind) + '</span> '
      + (x.time ? '<b>' + esc(x.time) + '</b> ' : '') + esc(x.title) + (x.overdue ? ' <span class="tag bad">밀림</span>' : '') + '</label>';
  }).join('');
  if (goals.length) h += '<h3 class="small" style="margin:12px 0 6px">🎯 오늘 목표 기준량</h3>' + goals.map(function (g) {
    return '<div class="todo-row"><span class="tag">' + esc(g.period) + '</span> ' + esc(g.title) + ' · 오늘 <b>' + esc(g.daily) + esc(g.unit || '') + '</b></div>';
  }).join('');
  return h;
}

/* ───────── 할일 (관리 / 영업) ───────── */
function taskSection(tasks, who) {
  var mine = !isLead() || !who || who === B.me.email;
  var col = function (kind) {
    var list = tasks.filter(function (t) { return t.kind === kind; });
    return '<div class="card"><div class="ct" style="justify-content:space-between"><span class="t">' + kind + '</span>'
      + (mine ? '<button class="btn sm" onclick="taskForm(null,\'' + kind + '\')">+ 추가</button>' : '') + '</div>'
      + (list.length ? list.map(function (t) {
        return '<div class="task' + (t.done ? ' done' : '') + (t.overdue ? ' late' : '') + '">'
          + (mine && t.email === B.me.email && (t.today || t.repeat === '없음') ? '<input type="checkbox"' + (t.done ? ' checked' : '') + ' onchange="taskDone(\'' + t.id + '\',this.checked)" aria-label="완료">' : '<span class="dotk"></span>')
          + '<div class="tb"><div>' + (t.time ? '<b>' + esc(t.time) + '</b> ' : '') + esc(t.title) + (isLead() && !who ? ' <span class="muted small">' + esc(t.who) + '</span>' : '') + '</div>'
          + '<div class="muted small">' + repeatText(t) + (t.overdue ? ' · <span class="down">밀림</span>' : '') + (t.memo ? ' · ' + esc(t.memo) : '') + '</div></div>'
          + (mine || isLead() ? '<button class="linkbtn small" onclick="taskForm(\'' + t.id + '\')">수정</button>' : '') + '</div>';
      }).join('') : '<p class="muted small">아직 없어요.' + (mine ? ' 매일·매주 반복할 일도 넣을 수 있어요.' : '') + '</p>') + '</div>';
  };
  return '<div class="sec"><h3>할일 <span class="muted small">직접 쓰는 업무 목록 · 승인 없이 바로 사용</span></h3><div class="grid2 tasks">' + col('관리') + col('영업') + '</div></div>';
}
function repeatText(t) {
  if (t.repeat === '없음') return (t.due ? md(t.due) + '까지' : '한 번');
  if (t.repeat === '매주') return '매주 ' + esc(t.repeatValue);
  if (t.repeat === '매월') return '매월 ' + esc(t.repeatValue) + '일';
  return esc(t.repeat);
}
function taskForm(id, kind) {
  var t = id ? (window._tasks || []).find(function (x) { return x.id === id; }) : { kind: kind || '관리', title: '', memo: '', repeat: '없음', repeatValue: '', due: B.today, time: '' };
  var days = (t.repeatValue || '').split(',');
  openModal('<h3>' + (id ? '할일 수정' : '할일 추가') + '</h3>'
    + '<div class="grid2" style="margin-top:12px"><label class="f"><span>분류</span><select id="k_kind">' + opts(B.options.taskKinds, t.kind) + '</select></label>'
    + '<label class="f"><span>시간 (선택)</span><input type="text" id="k_time" placeholder="10:00" value="' + esc(t.time) + '"></label></div>'
    + '<label class="f"><span>할일</span><input type="text" id="k_title" value="' + esc(t.title) + '" placeholder="예: 담당 계정 비즈머니 잔액 확인"></label>'
    + '<label class="f"><span>반복</span><select id="k_rep" onchange="repUI()">' + opts(B.options.taskRepeats, t.repeat) + '</select></label>'
    + '<div id="k_due" class="f"><span class="small muted">기한</span><input type="date" id="k_date" value="' + esc(t.due || B.today) + '"></div>'
    + '<div id="k_week" class="f chips">' + B.options.weekdays.map(function (d) { return '<label class="chip"><input type="checkbox" class="k_wd" value="' + d + '"' + (days.indexOf(d) >= 0 ? ' checked' : '') + '> ' + d + '</label>'; }).join('') + '</div>'
    + '<label class="f" id="k_month"><span>매월 며칠</span><input type="number" id="k_md" min="1" max="31" value="' + esc(t.repeat === '매월' ? t.repeatValue : 1) + '"></label>'
    + '<label class="f"><span>메모 (선택)</span><input type="text" id="k_memo" value="' + esc(t.memo) + '"></label>'
    + '<div class="actions">' + (id ? '<button class="btn no" onclick="taskDel(\'' + id + '\')">삭제</button>' : '') + '<button class="btn ghost" onclick="closeModal()">취소</button><button class="btn pri" onclick="taskSave(\'' + (id || '') + '\')">저장</button></div>');
  repUI();
}
function repUI() {
  var r = val('k_rep');
  $('k_due').style.display = r === '없음' ? 'block' : 'none';
  $('k_week').style.display = r === '매주' ? 'flex' : 'none';
  $('k_month').style.display = r === '매월' ? 'block' : 'none';
}
function taskSave(id) {
  var r = val('k_rep');
  var rv = r === '매주' ? [].slice.call(document.querySelectorAll('.k_wd:checked')).map(function (x) { return x.value; }).join(',') : r === '매월' ? val('k_md') : '';
  call('taskSave', { id: id, email: ST.taskWho || '', kind: val('k_kind'), title: val('k_title'), memo: val('k_memo'), repeat: r, repeatValue: rv, due: val('k_date'), time: val('k_time') })
    .then(function () { closeModal(); toast('저장했어요'); reTask(); refreshBadges(); }).catch(fail);
}
function taskDel(id) { if (!confirm('이 할일을 지울까요? 지난 완료 기록은 남습니다.')) return; call('taskDelete', { id: id }).then(function () { closeModal(); toast('지웠어요'); reTask(); refreshBadges(); }).catch(fail); }
function reTask() { if (CUR === 'task') viewTask(); else if (CUR === 'plan') viewPlan(); }
function taskDone(id, done, inPopup) {
  call('taskDone', { id: id, done: done }).then(function () { toast(done ? '완료!' : '취소했어요'); refreshBadges(); if (!inPopup) reTask(); }).catch(fail);
}

/* ───────── 영업노트 (기존 영업노트 앱의 가망건을 읽어서 보여줌) ───────── */
function openLead(id) { ST.openLead = id; ST.salesGrade = '전체'; ST.salesDue = '전체'; ST.salesOpen = false; go('sales'); }
function viewSales() {
  var who = isLead() ? ST.salesWho : '';
  call('leadList', { email: who }).then(function (r) {
    var list = r.leads; window._leads = list;
    var q = (ST.salesQ || '').trim(), g = ST.salesGrade, dueF = ST.salesDue;
    var open = list.filter(function (l) { return l.open; });
    var late = open.filter(function (l) { return l.overdue; }), today = open.filter(function (l) { return l.due && !l.overdue; });
    var shown = list.filter(function (l) {
      if (ST.salesOpen && !l.open) return false;
      if (dueF === '기한 지남' && !l.overdue) return false;
      if (dueF === '기한 안 지남' && (l.overdue || !l.next)) return false;
      if (dueF === '연락일 없음' && l.next) return false;
      return !q || [l.company, l.person, l.phone, l.memo, l.industry].join(' ').indexOf(q) >= 0;
    });
    var h = '<div class="head"><div><h2>영업노트</h2><p>영업노트 앱에 저장한 내 가망건을 가망도(상·중·하)별로, 기한 지난 것부터 보여줍니다. 저장·수정은 영업노트 앱에서 해요.</p></div>'
      + (r.app ? '<a class="btn pri" href="' + esc(r.app) + '" target="_blank" rel="noopener">영업노트 열기</a>' : '') + '</div>'
      + (r.error ? '<div class="empty"><b>영업노트를 읽지 못했어요</b>' + esc(r.error) + '</div>' : '')
      + (isLead() ? '<div class="row" style="margin-bottom:10px"><span class="small muted">팀원 선택</span><select style="width:auto" onchange="ST.salesWho=this.value;viewSales()">' + memberOpts(who, true) + '</select></div>' : '')
      + '<div class="stats" style="margin-bottom:14px">'
      + '<div class="stat"><div class="l">기한 지난 연락</div><div class="v" style="color:' + (late.length ? 'var(--bad)' : 'var(--g900)') + '">' + late.length + '곳</div><div class="d muted">' + noteGrades().map(function (x) { return x + ' ' + late.filter(function (l) { return l.grade === x; }).length; }).join(' · ') + '</div></div>'
      + '<div class="stat"><div class="l">오늘 연락</div><div class="v" style="color:' + (today.length ? 'var(--warn)' : 'var(--g900)') + '">' + today.length + '곳</div><div class="d muted">' + noteGrades().map(function (x) { return x + ' ' + today.filter(function (l) { return l.grade === x; }).length; }).join(' · ') + '</div></div>'
      + '<div class="stat"><div class="l">진행 중 가망건</div><div class="v">' + open.length + '곳</div><div class="d muted">' + noteGrades().map(function (x) { return x + ' ' + open.filter(function (l) { return l.grade === x; }).length; }).join(' · ') + '</div></div></div>'
      + '<div class="row" style="justify-content:space-between;margin-bottom:12px;gap:8px"><div class="chips">'
      + ['전체'].concat(noteGrades()).map(function (c) { return '<button class="chip' + (c === g ? ' on' : '') + '" onclick="ST.salesGrade=\'' + c + '\';viewSales()">' + (c === '전체' ? '상·중·하 전체' : '가망도 ' + c) + '</button>'; }).join('')
      + '</div><div class="chips">' + ['전체', '기한 지남', '기한 안 지남', '연락일 없음'].map(function (c) { return '<button class="chip' + (c === dueF ? ' on' : '') + '" onclick="ST.salesDue=\'' + c + '\';viewSales()">' + c + '</button>'; }).join('') + '</div></div>'
      + '<div class="row" style="justify-content:space-between;margin-bottom:12px"><label class="small"><input type="checkbox"' + (ST.salesOpen ? ' checked' : '') + ' onchange="ST.salesOpen=this.checked;viewSales()"> 진행 중만 (계약·보류·종료 빼기)</label>'
      + '<input type="text" style="width:220px" placeholder="업체명·연락처·메모 찾기" value="' + esc(q) + '" oninput="ST.salesQ=this.value;clearTimeout(window._sq);window._sq=setTimeout(viewSales,350)"></div>';
    var groups = (g === '전체' ? noteGrades().concat(['미정']) : [g]).map(function (x) {
      return { grade: x, items: shown.filter(function (l) { return l.grade === x; }).sort(leadOrder) };
    }).filter(function (x) { return x.items.length || g !== '전체' || x.grade !== '미정'; });
    h += groups.map(function (x) {
      return '<div class="card"><div class="ct"><span class="grade g' + x.grade + '">' + (x.grade === '미정' ? '-' : x.grade) + '</span><span class="t">가망도 ' + x.grade + '</span><span class="muted small">' + x.items.length + '곳'
        + (x.items.filter(function (l) { return l.overdue; }).length ? ' · <span class="down">기한 지남 ' + x.items.filter(function (l) { return l.overdue; }).length + '</span>' : '') + '</span></div>'
        + (x.items.length ? x.items.map(leadRow).join('') : '<p class="muted small">해당하는 가망건이 없어요.</p>') + '</div>';
    }).join('');
    if (!list.length && !r.error) h += '<div class="empty"><b>아직 가망건이 없어요</b>영업노트 앱에서 가망건을 저장하면 여기에 바로 보여요(최대 2분).</div>';
    $('view').innerHTML = h;
    if (ST.openLead) {
      var id = ST.openLead; ST.openLead = '';
      var el = document.getElementById('lead-' + id);
      if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'center' }); }
    }
  }).catch(fail);
}
function noteGrades() { return (B.options.noteGrades || ['상', '중', '하']); }
/** 기한 지난 것(오래된 순) → 기한 안 지난 것(가까운 순) → 연락일 없음 → 끝난 것 */
function leadOrder(a, b) {
  var k = function (l) { return !l.open ? 3 : l.overdue ? 0 : l.next ? 1 : 2; };
  return (k(a) - k(b)) || ((a.next || '9') < (b.next || '9') ? -1 : (a.next || '9') > (b.next || '9') ? 1 : 0) || (a.updated < b.updated ? 1 : -1);
}
function dayGap(d) { return Math.round((Date.parse(d.slice(0, 10)) - Date.parse(B.today)) / 864e5); }
function leadRow(l) {
  var tag = { '신규': 'gray', '연락중': 'blue', '제안발송': 'warn', '미팅': 'warn', '계약': '', '보류': 'gray', '종료': 'bad' }[l.status];
  var when = !l.open ? '<span class="muted">' + esc(l.status) + '</span>' : !l.next ? '<span class="muted">연락일 없음</span>'
    : '<b>' + md(l.next) + (l.next.length > 10 ? ' ' + l.next.slice(11, 16) : '') + '</b><div class="small ' + (l.overdue ? 'down' : 'muted') + '">'
      + (l.overdue ? (dayGap(l.next) < 0 ? -dayGap(l.next) + '일 지남' : '시간 지남') : dayGap(l.next) === 0 ? '오늘' : 'D-' + dayGap(l.next)) + '</div>';
  return '<div class="lead-row' + (l.overdue ? ' late' : '') + '" id="lead-' + esc(l.id) + '"><div class="lb"><div><span class="tag ' + (tag || '') + '">' + esc(l.status) + '</span> <b>' + esc(l.company) + '</b>'
    + (l.industry ? ' <span class="muted small">' + esc(l.industry) + '</span>' : '') + (isLead() ? ' <span class="muted small">· ' + esc(l.who) + '</span>' : '') + '</div>'
    + ((l.person || l.phone) ? '<div class="small">' + esc(l.person || '') + (l.phone ? ' · <a href="tel:' + esc(l.phone) + '">' + esc(l.phone) + '</a>' : '') + '</div>' : '')
    + (l.memo ? '<div class="muted small">' + esc(l.memo.length > 120 ? l.memo.slice(0, 120) + '…' : l.memo) + '</div>' : '')
    + '<div class="small muted">' + (l.lastContact ? '최근 연락 ' + md(l.lastContact) + ' · ' : '') + '<button class="linkbtn small" onclick="leadHistory(\'' + esc(l.id) + '\')">연락 기록</button></div></div>'
    + '<div class="when">' + when + '</div></div>';
}
function leadById(id) { return (window._leads || []).find(function (l) { return l.id === id; }); }
function leadHistory(id) {
  var l = leadById(id);
  call('leadHistory', { id: id }).then(function (list) {
    openModal('<h3>' + esc(l ? l.company : '') + ' · 연락 기록</h3>' + (list.length ? '<div class="scroll" style="margin-top:10px"><table class="tbl"><tr><th>일시</th><th>방식</th><th>내용</th><th>다음 연락</th></tr>' + list.map(function (c) {
      return '<tr><td>' + esc(md(c.at)) + ' ' + esc(String(c.at).slice(11, 16)) + '</td><td>' + esc(c.result) + '</td><td>' + esc(c.memo) + '</td><td>' + (c.next ? esc(md(c.next)) + ' ' + esc(c.next.slice(11)) : '-') + '</td></tr>';
    }).join('') + '</table></div>' : '<p class="muted small" style="margin-top:10px">아직 기록이 없어요.</p>') + '<div class="actions"><button class="btn pri" onclick="closeModal()">닫기</button></div>');
  }).catch(fail);
}

/* ───────── 할일 탭 (관리 / 영업) + 기존 '내 할 일' 앱에서 가져오기 ───────── */
function viewTask() {
  var who = isLead() ? ST.taskWho : B.me.email;
  var own = !isLead() || !who || who === B.me.email;
  Promise.all([call('taskList', { email: who }), own ? call('today') : Promise.resolve(null)]).then(function (r) {
    var tasks = r[0], tday = r[1];
    window._tasks = tasks;
    var todayN = tasks.filter(function (t) { return t.today && !t.done && t.email === B.me.email; }).length;
    var h = '<div class="head"><div><h2>할일</h2><p>관리·영업 할일을 직접 쓰고 체크합니다. 매일·평일·매주·매월 반복도 돼요.</p></div>'
      + '<div class="row">' + (own ? '<button class="btn ghost" onclick="importForm()">내 할 일 앱에서 가져오기</button>' : '') + '<button class="btn pri" onclick="taskForm()">할일 추가</button></div></div>';
    if (isLead()) h += '<div class="row" style="margin-bottom:6px"><span class="small muted">팀원 선택</span><select style="width:auto" onchange="ST.taskWho=this.value;viewTask()">' + memberOpts(who, true) + '</select></div>';
    if (own) h += '<p class="small muted">오늘 남은 할일 <b>' + todayN + '개</b>' + (tday && tday.calls.length ? ' · 오늘 연락할 가망건 <a href="#" onclick="go(\'sales\');return false">' + tday.calls.length + '곳</a>' : '') + '</p>';
    h += taskSection(tasks, who);
    $('view').innerHTML = h;
  }).catch(fail);
}
function importForm() {

/** todos.json 모양을 몰라도 읽히게: 목록을 찾아 흔한 이름의 칸에서 값을 꺼냄 */
function parseTodos(data) {
  var arr = Array.isArray(data) ? data : null;
  if (!arr && data && typeof data === 'object') {
    ['todos', 'items', 'tasks', 'list', 'data'].some(function (k) { if (Array.isArray(data[k])) { arr = data[k]; return true; } return false; });
    if (!arr) Object.keys(data).some(function (k) { if (Array.isArray(data[k]) && data[k].length && typeof data[k][0] === 'object') { arr = data[k]; return true; } return false; });
  }
  arr = arr || [];
  var pick = function (o, ks) { for (var i = 0; i < ks.length; i++) { var v = o[ks[i]]; if (v !== undefined && v !== null && v !== '') return v; } return ''; };
  var out = { items: [], total: arr.length, done: 0, sales: 0 };
  arr.forEach(function (o) {
    if (!o || typeof o !== 'object') return;
    var title = String(pick(o, ['title', 'text', 'content', 'name', 'task', 'todo', '제목', '할일', '내용'])).trim();
    if (!title) return;
    var st = String(pick(o, ['status', 'state', '상태'])).toLowerCase();
    var done = pick(o, ['done', 'completed', 'complete', 'checked', 'isDone', 'finished', '완료']);
    if (done === true || done === 1 || /^(true|y|yes|1|완료)$/i.test(String(done)) || /done|complete|완료/.test(st)) { out.done++; return; }
    if (/영업 다음 연락|다음 연락 ·/.test(title) || o.leadId || o.linkKey || o.source === 'sales') { out.sales++; return; }
    var cat = String(pick(o, ['category', 'kind', 'type', 'group', 'tag', '분류'])).toLowerCase();
    var rep = String(pick(o, ['repeat', 'recurrence', 'recur', 'routine', 'cycle', '반복'])).toLowerCase();
    var repeat = /daily|매일|every ?day/.test(rep) ? '매일' : /weekday|평일/.test(rep) ? '평일' : /month|매월/.test(rep) ? '매월' : /week|매주/.test(rep) ? '매주' : '없음';
    var rv = pick(o, ['repeatValue', 'days', 'weekdays', 'day', '반복값']);
    if (Array.isArray(rv)) rv = rv.map(function (d) { return typeof d === 'number' ? '일월화수목금토'[d % 7] : String(d).slice(0, 1); }).join(',');
    rv = String(rv || '');
    if (repeat === '매주' && !rv) repeat = '없음';
    var due = String(pick(o, ['due', 'dueDate', 'date', 'deadline', 'day_', '기한', '날짜'])).replace(/\./g, '-').replace(/\//g, '-');
    var dm = due.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    var tm = String(pick(o, ['time', 'dueTime', 'alarm', 'remind', '시간']) || (due.match(/\d{1,2}:\d{2}/) || [''])[0]).match(/(\d{1,2}):(\d{2})/);
    out.items.push({
      title: title.slice(0, 200), kind: /영업|sales/.test(cat) ? '영업' : '관리', memo: String(pick(o, ['memo', 'note', 'notes', 'description', 'detail', '메모'])).slice(0, 2000),
      repeat: repeat, repeatValue: rv, due: dm ? dm[1] + '-' + ('0' + dm[2]).slice(-2) + '-' + ('0' + dm[3]).slice(-2) : '', time: tm ? ('0' + tm[1]).slice(-2) + ':' + tm[2] : '',
    });
  });
  return out;
}

/** 본문 속 ⟦화면 N · 설명⟧ 자리에 화면이 들어갑니다(2팀 가이드처럼 글 사이에 화면) */

  });
}
function shotHtml(it, i) {

/** 화면 묶음을 불러와 본문 자리에 넣고, 자리가 없는 화면(단계별 따라하기)은 설명과 함께 아래에 붙입니다 */
function guideShots(id) {

    + m.media.map(function (r) {
      var bars = r.amts.map(function (a, i) { var hh = Math.max(1, Math.round(a / max * 28)); return '<rect x="' + (i * 16) + '" y="' + (30 - hh) + '" width="12" height="' + hh + '" rx="2" fill="' + (i === 3 ? '#9fd3b6' : '#25935f') + '"/>'; }).join('');
      return '<tr><td><b>' + esc(r.media) + '</b></td>' + r.amts.map(function (a, i) { return '<td class="r">' + (m.has[i] ? won(a) : '<span class="muted">-</span>') + '</td>'; }).join('')
        + '<td><svg width="64" height="30" viewBox="0 0 64 30">' + bars + '</svg></td><td class="r">' + (m.has[0] && m.has[2] ? chg(r.amts[2], r.amts[0]) : '<span class="muted">-</span>') + '</td></tr>';
    }).join('') + '</table></div></div>';
}
function accTable(title, list) {
  return '<div>' + (title ? '<h3 class="small muted">' + title + '</h3>' : '') + '<div class="scroll"><table class="tbl"><tr><th>광고주</th><th class="r">이번 달</th><th class="r">지난달 같은 기간</th><th class="r">증감</th></tr>'
    + (list.length ? list.map(function (a) { return '<tr><td>' + esc(a.name) + ' <span class="muted small">' + esc(a.media) + '</span></td><td class="r">' + won(a.mtd) + '</td><td class="r">' + won(a.prevMtd) + '</td><td class="r">' + chg(a.mtd, a.prevMtd) + '</td></tr>'; }).join('') : '<tr><td colspan="4" class="muted">없음</td></tr>')
    + '</table></div></div>';
}
function trendSvg(t) {
  var max = Math.max.apply(null, t.map(function (x) { return x.amt; }).concat([1]));
  var W = 900, H = 150, bw = W / t.length;
  var bars = t.map(function (x, i) {
    var h = Math.max(1, x.amt / max * (H - 24));
    var we = new Date(x.date + 'T00:00:00Z').getUTCDay(); we = we === 0 || we === 6;
    return '<g><title>' + x.date + ' ' + won(x.amt) + '</title><rect x="' + (i * bw + 2) + '" y="' + (H - 18 - h) + '" width="' + (bw - 4) + '" height="' + h + '" rx="3" fill="' + (i === t.length - 1 ? '#0f3d2c' : (we ? '#c5e3d1' : '#25935f')) + '"/>'
      + (i % 5 === 4 || i === t.length - 1 ? '<text x="' + (i * bw + bw / 2) + '" y="' + (H - 3) + '" font-size="11" text-anchor="middle" fill="#4b5f55">' + md(x.date) + '</text>' : '') + '</g>';
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="최근 30일 일별 매출 막대그래프">' + bars + '</svg><p class="muted small">연한 막대는 주말, 진한 막대는 가장 최근 날짜입니다.</p>';
}
function ahiBlock(a) {
  var warns = a.metrics.filter(function (m) { return m.warn; });
  var h = '<div class="sec"><h3>AHI 건강 신호 <span class="muted small">' + Number(a.month.slice(5)) + '월 마감 기준 · ' + Number(a.prevMonth.slice(5)) + '월과 비교</span></h3>'
    + '<p class="muted small" style="margin:-6px 0 12px">점수 구간표 없이, AHI를 만드는 원재료 지표가 전월보다 나빠졌는지만 봅니다. 주황색 칸이 먼저 챙길 곳이고, 비중이 큰 축부터 보여줍니다.</p>';
  if (warns.length) h += '<div class="pop"><b>' + warns.map(function (m) { return m.axis + '·' + m.label; }).join(', ') + '</b> 이(가) 떨어지고 있어요. AHI가 내려갈 수 있는 신호입니다.</div>';
  h += '<div class="ahi">' + a.metrics.map(function (m) {
    var v = m.cur === null ? '<span class="muted" style="font-size:15px">계산 불가</span>' : num(m.cur) + '<span style="font-size:14px">' + m.unit + '</span>';
    var dl = m.delta === null ? '' : (function () { var good = m.good === 'up' ? m.delta >= 0 : m.delta <= 0; return '<span class="' + (good ? 'up' : 'down') + '">' + (m.delta >= 0 ? '▲' : '▼') + ' ' + Math.abs(m.delta) + m.deltaUnit + '</span>'; })();
    return '<div class="ax' + (m.warn ? ' warn' : '') + '"><div class="top2"><span>' + m.axis + ' 축 · 비중 ' + m.weight + '%</span>' + (m.warn ? '<span class="tag warn">주의</span>' : '') + '</div>'
      + '<div class="nm">' + m.label + '</div><div class="row"><span class="v">' + v + '</span>' + dl + '</div><div class="h">' + esc(m.note || m.hint) + '</div></div>';
  }).join('') + '</div>';
  if (a.lost.length) h += '<details><summary>지난달엔 집행했는데 이번 달 멈춘 계정 ' + a.lost.length + '곳</summary><table class="tbl small">' + a.lost.map(function (l) { return '<tr><td>' + esc(l.name) + '</td><td>' + esc(l.media) + '</td><td class="r">' + won(l.prev) + '</td></tr>'; }).join('') + '</table></details>';
  h += '<p class="muted small" style="margin-top:8px">이력이 3~6개월 이상 쌓여야 계산되는 지표가 있습니다. 데이터 시작: ' + esc(a.dataStart) + '</p></div>';
  return h;
}

/* ───────── 팀 현황 (팀장) ───────── */
function viewAdmin() {
  var month = ST.adminMonth || B.today.slice(0, 7);
  Promise.all([call('teamStats', { month: month }), call('usageStats', { month: month })]).then(function (r) {
    var d = r[0], u = r[1];
    var h = '<div class="head"><div><h2>팀 현황</h2><p>팀장만 보는 화면입니다. 달성과 실패가 어디에 몰리는지 보고 팀원별로 관리 방식을 정하세요.</p></div>'
      + '<div class="row"><input type="month" style="width:auto" value="' + month + '" onchange="ST.adminMonth=this.value;viewAdmin()"></div></div>'
      + '<div class="scroll"><table class="tbl"><tr><th>팀원</th><th class="r">달성</th><th class="r">실패</th><th class="r">달성 비율</th><th class="r">소통 대기</th><th class="r">승인 대기</th><th class="r">진행 목표</th><th class="r">미확인 공지</th><th>마지막 체크</th><th>알리미</th><th></th></tr>'
      + d.members.map(function (m) {
        var hot = m.rate !== null && m.rate < 60;
        return '<tr' + (hot ? ' class="warn"' : '') + '><td><b>' + esc(m.name) + '</b></td><td class="r up">' + m.ok + '</td><td class="r down">' + m.fail + '</td><td class="r">' + (m.rate === null ? '-' : m.rate + '%') + '</td>'
          + '<td class="r">' + (m.talkPending || '') + '</td><td class="r">' + (m.pending || '') + '</td><td class="r">' + m.active + '</td><td class="r">' + (m.unread ? '<span class="down">' + m.unread + '</span>' : '0') + '</td>'
          + '<td>' + (m.lastCheck ? md(m.lastCheck) : '<span class="muted">없음</span>') + '</td><td>' + (m.hasAlert ? '<span class="tag">연결</span>' : '<span class="tag gray">미연결</span>') + '</td>'
          + '<td><button class="btn sm ghost" onclick="evalForm(\'' + m.email + '\')">평가자료</button></td></tr>';
      }).join('') + '</table></div>'
      + '<p class="muted small" style="margin-top:8px">달성 비율이 60% 미만이면 주황색으로 표시합니다. 팀원 추가·삭제와 담당자명은 원보드 시트의 <code>팀원</code> 탭에서 바꿉니다.</p>'
      + usageBlock(u)
      + '<div class="sec"><h3>팀장 전용 메뉴 늘리기</h3><p class="muted small">관리자 회의록 요약 같은 팀장 전용 탭은 코드의 <code>TABS</code> 목록에 한 줄을 추가하면 이 탭처럼 팀장에게만 보입니다.</p></div>';
    $('view').innerHTML = h;
  }).catch(fail);
}

/* ───────── 알리미 연결 ───────── */
function alertSetup(renew) {
  call('alertCode', { renew: !!renew }).then(function (d) {
    openModal('<h3>원보드 알리미 연결</h3><p class="muted small" style="margin:6px 0 12px">알리미(크롬 확장)를 설치하면 보드 창을 닫아도, 크롬이 켜져 있는 동안 공지 미확인 알림이 1시간마다, 오늘 할 일 알림이 아침에 뜹니다.</p>'
      + '<ol class="small" style="padding-left:18px;color:var(--ink2)"><li>팀장에게 받은 알리미 폴더를 크롬 <code>chrome://extensions</code> 에서 <b>압축해제된 확장 프로그램 로드</b>로 설치</li><li>알리미 아이콘 → <b>연결 코드</b>에 아래 코드를 붙여넣고 저장</li></ol>'
      + '<label class="f" style="margin-top:12px"><span>내 연결 코드 (다른 사람에게 주지 마세요)</span><input type="text" id="a_code" readonly value="' + esc(d.connect) + '" onclick="this.select()"></label>'
      + '<div class="actions"><button class="btn ghost" onclick="if(confirm(\'새 코드를 만들면 기존 연결은 끊깁니다. 계속할까요?\'))alertSetup(true)">새 코드 만들기</button><button class="btn pri" onclick="copyCode()">코드 복사</button></div>');
  }).catch(fail);
}
function copyCode() { var i = $('a_code'); i.select(); try { document.execCommand('copy'); toast('복사했어요'); } catch (e) { toast('직접 선택해서 복사하세요', true); } }

start();
</script>
