<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네이버 전담팀 원보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
  /* ───── 디자인 v1 토큰 (Claude Design 시안) ───── */
  :root{
    --g900:#0f3d2c; --g800:#14513a; --g600:#1d7a52; --g500:#25935f; --g200:#c5e3d1; --g100:#e3f1e8; --g50:#f3f9f5;
    --ink:#13261d; --ink2:#4b5f55; --ink3:#6b7d73; --line:#d8e5dc; --line2:#edf2ee; --bg:#f4f7f5; --paper:#fff;
    --bad:#b42318; --bad-bg:#fdeceb; --bad-line:#f3c4bf;
    --warn:#c2410c; --warn-bg:#fff2e8; --warn-line:#f6d0b2;
    --ok:#1d7a52; --ok-bg:#f3f9f5; --ok-line:#c5e3d1;
    --info:#2563a8; --info-bg:#ebf2fa; --info-line:#c6d8ee;
    --warnbg:var(--warn-bg); --badbg:var(--bad-bg); --blue:var(--info); --bluebg:var(--info-bg); --teal:#0f766e;
    --fs-num:30px; --fs-h1:24px; --fs-h2:18px; --fs-body:14px; --fs-sm:13px; --fs-xs:12px;
    --r-sm:6px; --r:10px; --r-lg:14px;
    --sh-pop:0 6px 20px rgba(15,61,44,.12); --sh-modal:0 20px 60px rgba(15,61,44,.25);
    --side:232px; --tap:44px;
    --font:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:var(--fs-body);line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--g500);outline-offset:2px}

  /* 레이아웃: 왼쪽 메뉴 + 본문 */
  .app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
  .side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--paper);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
  .brand{display:inline-flex;align-self:flex-start;font-size:18px;font-weight:800;letter-spacing:-.01em;color:var(--g900);border:2px solid var(--g900);border-radius:var(--r);padding:5px 12px;background:#fff}
  .who{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--ink3);flex-wrap:wrap;margin:6px 2px 10px}
  .who b{color:var(--ink)}
  .role{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--g100);color:var(--g800)}
  .nav-group{font-size:var(--fs-xs);color:var(--ink3);font-weight:600;margin:12px 10px 4px}
  .nav-item{display:flex;justify-content:space-between;align-items:center;width:100%;border:none;background:none;text-align:left;padding:9px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink);min-height:40px}
  .nav-item:hover{background:var(--g50)}
  .nav-item.on{background:var(--g900);color:#fff}
  .nav-item.lead{border:1.5px dashed var(--g800);font-weight:700}
  .nav-sep{border-top:1.5px dashed var(--line);margin:14px 0 2px}
  .nb{min-width:20px;height:20px;padding:0 6px;border-radius:99px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;background:var(--g100);color:var(--g800)}
  .nb.red{background:var(--bad);color:#fff}
  .nav-item.on .nb{background:#fff;color:var(--g900)}
  .nav-item.on .nb.red{background:#fff;color:var(--bad)}
  .side-foot{margin-top:auto;padding:14px 8px 0;font-size:var(--fs-xs);color:var(--ink3)}
  .linkbtn{background:none;border:none;color:var(--g600);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:2px}
  .mainwrap{min-width:0}
  main{max-width:1440px;padding:28px 40px 64px;min-height:60vh}
  .tabbar{display:none}

  h2{font-size:var(--fs-h1);font-weight:800;letter-spacing:-.01em}
  h3{font-size:var(--fs-h2);font-weight:800;margin-bottom:10px;letter-spacing:-.01em}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .head p{color:var(--ink2);font-size:var(--fs-sm);margin-top:4px}
  .sec{margin-top:28px}
  .muted{color:var(--ink3)} .small{font-size:var(--fs-sm)}

  /* 버튼·입력 */
  .btn{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:var(--r);padding:8px 14px;font-weight:700;font-size:var(--fs-sm);white-space:nowrap;min-height:36px}
  .btn:hover{background:var(--g50)}
  .btn.pri{background:var(--g900);border-color:var(--g900);color:#fff}
  .btn.pri:hover{background:var(--g800)}
  .btn.ok{background:var(--g600);border-color:var(--g600);color:#fff}
  .btn.no{border-color:var(--bad-line);color:var(--bad);background:#fff}
  .btn.ghost{border-color:var(--line);color:var(--ink2)}
  .btn.sm{padding:4px 10px;font-size:var(--fs-xs);border-radius:8px;min-height:30px}
  .btn.more{padding:4px 10px;min-width:36px;color:var(--ink2)}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-size:var(--fs-sm);font-weight:600;color:var(--ink2);min-height:32px}
  .chip b{color:var(--bad);margin-left:2px}
  .chip.on{border-color:var(--g900);background:var(--g900);color:#fff}
  .chip.on b{color:#fff}
  label.f{display:block;margin-bottom:12px}
  label.f span{display:block;font-size:var(--fs-xs);font-weight:700;color:var(--ink2);margin-bottom:4px}
  input[type=text],input[type=number],input[type=date],input[type=month],input[type=time],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:8px 11px;background:#fff;min-height:38px}
  input:focus,select:focus,textarea:focus{border-color:var(--g600);outline:none}
  textarea{min-height:90px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

  /* 카드 */
  .card{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;background:var(--paper)}
  .card+.card{margin-top:10px}
  .cols>.card{margin-top:0}
  .card.hot{border-color:var(--bad-line);background:var(--bad-bg)}
  .card.done{background:var(--g50)}
  .ct{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ct .t{font-weight:800;font-size:16px}
  .tag{font-size:var(--fs-xs);font-weight:700;padding:1px 8px;border-radius:var(--r-sm);background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line);white-space:nowrap;display:inline-block}
  .tag.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
  .tag.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
  .tag.blue{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
  .tag.gray{background:var(--line2);color:var(--ink2);border-color:var(--line2)}
  .meta{font-size:var(--fs-sm);color:var(--ink3);margin-top:3px}
  .body{white-space:pre-wrap;color:var(--ink2);margin-top:8px;font-size:var(--fs-body)}
  .bar{height:8px;border-radius:99px;background:var(--line2);overflow:visible;margin:10px 0 6px;position:relative}
  .bar i{display:block;height:100%;background:var(--g600);border-radius:99px}
  .bar.behind i{background:var(--warn)}
  .bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  .kv{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--ink2)}
  .kv b{color:var(--ink);font-weight:800}
  details summary{cursor:pointer;font-size:var(--fs-sm);font-weight:700;color:var(--g600);margin-top:8px}
  details[open] summary{margin-bottom:4px}
  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .empty{border:1px solid var(--line2);background:var(--line2);border-radius:var(--r-lg);padding:20px 22px;color:var(--ink2);font-size:var(--fs-sm)}
  .empty>b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}

  /* 접는 영역(요약 → 펼치기) */
  details.fold{border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;margin-top:12px}
  details.fold>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 20px;margin:0;color:var(--ink);font-size:15px}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::before{content:'▶';font-size:11px;color:var(--ink3);transition:transform .15s}
  details.fold[open]>summary::before{transform:rotate(90deg)}
  details.fold>summary b{font-weight:800}
  details.fold>summary .sum{color:var(--ink2);font-weight:500;font-size:var(--fs-sm);flex:1}
  details.fold>summary .open{color:var(--g600);font-weight:700;font-size:var(--fs-sm)}
  details.fold>.in{padding:0 20px 18px}

  /* 지금 할 일 줄 */
  .todo-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .todo-strip .ts{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:var(--r);padding:8px 16px;font-size:var(--fs-sm);font-weight:700;color:var(--ink2);min-height:44px}
  .todo-strip .ts b{font-size:22px;font-weight:800;color:var(--ok)}
  .todo-strip .ts.bad{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad)} .todo-strip .ts.bad b{color:var(--bad)}
  .todo-strip .ts.warn{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn)} .todo-strip .ts.warn b{color:var(--warn)}
  .todo-strip button.ts{cursor:pointer}
  .banner{border:1px solid var(--info-line);background:var(--info-bg);border-radius:var(--r);padding:10px 16px;font-size:var(--fs-sm);margin-bottom:14px;color:var(--ink)}
  .banner.warn{border-color:var(--warn-line,#f5c9a8);background:var(--warn-bg,#fff4ec)}
  .banner b.k{color:var(--info);margin-right:8px}

  /* 숫자 요약칸 */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border:2px solid var(--g900);border-radius:var(--r-lg);overflow:hidden;background:#fff}
  .stat{padding:14px 18px;border-right:1px solid var(--line)}
  .stat:last-child{border-right:none}
  .stat .l{font-size:var(--fs-xs);color:var(--ink2);font-weight:600}
  .stat .v{font-size:var(--fs-num);font-weight:800;letter-spacing:-.01em;line-height:1.25;color:var(--g900)}
  .stat .d{font-size:var(--fs-xs);font-weight:700}
  .stat.is-bad{background:var(--bad-bg)} .stat.is-bad .l,.stat.is-bad .v,.stat.is-bad .d{color:var(--bad)}
  .up{color:var(--g600)} .down{color:var(--bad)}

  /* 표 */
  .tbl{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
  .tbl th{font-size:var(--fs-xs);color:var(--ink2);text-align:left;font-weight:600;padding:8px 10px;border-bottom:2px solid var(--g900);white-space:nowrap}
  .tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
  .tbl td.r,.tbl th.r{text-align:right}
  .tbl tr.warn td{background:var(--warn-bg)}
  .tbl tr.bad td{background:var(--bad-bg)}
  .scroll{overflow-x:auto}

  /* AHI */
  .ahi{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .ax{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
  .ax.warn{border-color:var(--warn-line);background:var(--warn-bg)}
  .ax .top2{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-xs);font-weight:700;color:var(--ink2)}
  .ax .nm{font-weight:800;font-size:15px;margin-top:2px}
  .ax .v{font-size:22px;font-weight:800}
  .ax .h{font-size:var(--fs-xs);color:var(--ink3)}

  /* 캘린더 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:#fff}
  .cal .dow{background:#fff;color:var(--ink2);font-size:var(--fs-xs);font-weight:700;text-align:center;padding:8px 0;border-bottom:2px solid var(--g900)}
  .cal .day{min-height:108px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px 6px;background:#fff;text-align:left;border-top:none;border-left:none;display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .cal .day:nth-child(7n){border-right:none}
  .cal .day.out{background:var(--bg);color:var(--ink3)}
  .cal .day.today{background:var(--g50);box-shadow:inset 0 0 0 2px var(--g600)}
  .cal .day.today .dn{background:var(--g900);color:#fff;border-radius:99px;padding:0 7px}
  .cal .day.sel{box-shadow:inset 0 0 0 2.5px var(--g500)}
  .cal .dn{font-size:var(--fs-sm);font-weight:800;align-self:flex-start}
  .cal .dn.sun{color:var(--bad)}
  .ev{font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .ev.팀{background:var(--g100);color:var(--g800)} .ev.개인{background:#e2f4f1;color:var(--teal)}
  .ev.미팅{background:var(--info-bg);color:var(--info)} .ev.프로모션{background:var(--warn-bg);color:var(--warn)}
  .ev.마감{background:var(--line2);color:var(--ink)}
  .ev.연락{background:#e2f0ff;color:#1d5fa8}
  .ev.외근{background:#efe9fb;color:#5b3fa8} .ev.근태{background:#fdf0f4;color:#a8325b} .ev.매체{background:#fff1dc;color:#9a5b00}
  .ck{font-size:11.5px;font-weight:800;margin-top:auto}
  .ck .o{color:var(--g600)} .ck .x{color:var(--bad)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--ink2);margin:10px 0}
  .dot{display:none;width:6px;height:6px;border-radius:99px;background:var(--g500)}

  .todo-row{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:6px;font-size:var(--fs-body);gap:8px;background:#fff}
  .todo-row.late{border-color:var(--bad-line);background:var(--bad-bg)}
  .shot{margin:0 0 18px}.shot figcaption{font-size:var(--fs-sm);line-height:1.6;margin-bottom:6px}.shot .tip{color:var(--warn);margin-top:2px}
  .shotph{padding:18px;border:1px dashed var(--line);border-radius:8px;color:var(--ink3);font-size:var(--fs-sm)}
  .gbody .shot{margin:10px 0 14px;white-space:normal}
  .shot img{width:100%;border:1px solid var(--line);border-radius:8px;display:block}
  .lead-row{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-top:1px solid var(--line2)}
  .lead-row:first-of-type{border-top:none}
  .lead-row .lb{flex:1;min-width:0}
  .lead-row .when{min-width:96px;text-align:right;font-size:var(--fs-sm)}
  .lead-row.late{background:var(--bad-bg);border-radius:8px}
  .lead-row.late .when b{color:var(--bad)}
  .lead-row.flash{background:#fff7e6}
  .grade{display:inline-block;min-width:26px;height:26px;border-radius:7px;text-align:center;line-height:26px;font-weight:800;font-size:13px;color:#fff;background:var(--ink3)}
  .grade.g상{background:var(--g900)}.grade.g중{background:var(--g600)}.grade.g하{background:var(--g200);color:var(--g900)}
  .task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2)}
  .task:first-of-type{border-top:none}
  .task input{margin-top:3px;width:20px;height:20px;accent-color:var(--g600)}
  .task .tb{flex:1;min-width:0}
  .tkeys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 6px}.tkeys .tk{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--g50);border-radius:10px}.tkeys .tk b{font-size:18px}
  svg.trend .tb-bar:hover rect:nth-child(3){fill:#c2410c}
  .task .co{display:inline-block;font-weight:700;color:var(--g800);background:var(--g50);border:1px solid var(--g200);border-radius:6px;padding:0 6px;margin-right:4px;font-size:12.5px}
  .task.done .tb>div:first-child{text-decoration:line-through;color:var(--ink3)}
  .task.late{background:var(--bad-bg);border-radius:8px;padding-left:8px;padding-right:8px}
  .task.late .tb>div:first-child{color:var(--bad)}
  .dotk{width:8px;height:8px;border-radius:99px;background:var(--g200);margin-top:7px}
  .tasks{gap:12px}
  .tasks>.card{margin-top:0}

  /* 가이드 */
  .guide{display:grid;grid-template-columns:220px minmax(0,760px);gap:24px}
  .mlist{display:flex;flex-direction:column;gap:6px}
  .mlist button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:9px 13px;font-weight:600;min-height:40px}
  .mlist button.on{border-color:var(--g900);background:var(--g900);color:#fff}
  .gbody{white-space:pre-wrap;font-size:var(--fs-body);color:var(--ink2);line-height:1.75}
  .gbody a{color:var(--g600)}

  /* 모달·알림 */
  .modal{position:fixed;inset:0;background:rgba(15,61,44,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
  .modal[hidden]{display:none}
  .sheet{background:#fff;border-radius:var(--r-lg);width:100%;max-width:560px;padding:24px 24px 20px;position:relative;box-shadow:var(--sh-modal)}
  .sheet h3{font-size:20px;padding-right:36px}
  .close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
  .pop{border:1px solid var(--warn-line);background:var(--warn-bg);padding:10px 14px;border-radius:var(--r);margin-bottom:10px}
  .pop.naver{border-color:#b6ebcb;background:#eefbf3}
  .card.naver{border-color:#03c75a;box-shadow:inset 4px 0 0 #03c75a}
  .card.naver.hot{background:#f3fcf6}
  .tag.nv{background:#03c75a;color:#fff;border-color:#03c75a}
  .mtabs{display:flex;gap:8px;flex-wrap:wrap}
  .mtab{border:1.5px solid var(--line);background:#fff;border-radius:var(--r);padding:8px 16px;font-weight:700;font-size:var(--fs-body);color:var(--ink2)}
  .mtab span{font-weight:600;color:var(--ink3);font-size:var(--fs-sm)}
  .mtab b{margin-left:4px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:var(--fs-xs)}
  .mtab.on{border-color:var(--g900);background:var(--g900);color:#fff}
  .mtab.on span{color:#cfe5d8}
  .mtab.naver{border-color:#03c75a;color:#03a14a}
  .mtab.naver.on{background:#03c75a;border-color:#03c75a;color:#fff}
  .mtab.naver.on span{color:#e6fbef}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g900);color:#fff;padding:10px 18px;border-radius:var(--r);font-weight:700;z-index:60;max-width:90vw;display:none;box-shadow:var(--sh-pop)}
  .toast.err{background:var(--bad)}
  .loading{color:var(--ink3);padding:30px 0}
  .loading::before{content:'';display:block;height:12px;border-radius:6px;background:var(--line2);width:60%;margin-bottom:10px}
  .fatal{border:1px solid var(--bad-line);background:var(--bad-bg);border-radius:var(--r-lg);padding:18px 22px;color:var(--bad);font-weight:700}
  code{background:var(--g50);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:var(--fs-sm);word-break:break-all}
  .irow{display:block;border-radius:var(--r);margin-top:6px}
  .irow>summary,.irow.none{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);margin:0;color:var(--ink);font-size:var(--fs-sm);cursor:pointer}
  .irow>summary::-webkit-details-marker{display:none}
  .irow.warn>summary{background:var(--warn-bg)} .irow.info>summary{background:var(--line2)} .irow.none{cursor:default}
  .irow .cnt{margin-left:auto;font-weight:800}
  .irow.warn .cnt{color:var(--warn)}
  details.kebab{position:relative}
  details.kebab>summary{list-style:none;margin:0;color:var(--ink2)} details.kebab>summary::-webkit-details-marker{display:none}
  details.kebab .menu{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-pop);padding:4px;z-index:5;min-width:110px}
  details.kebab .menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 12px;border-radius:6px;font-size:var(--fs-sm);font-weight:600}
  details.kebab .menu button:hover{background:var(--g50)}
  .card.goal+.card.goal{margin-top:10px} .cols>.card.goal{margin-top:0}
  .more-list .nav-item{border:1px solid var(--line);background:#fff;margin-bottom:8px;min-height:var(--tap);padding:12px 16px}

  /* 모바일 (900px 이하: 왼쪽 메뉴 → 아래 탭 5칸) */
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .side{display:none}
    main{padding:16px 16px 96px}
    .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom,0)}
    .tabbar button{position:relative;border:none;background:none;min-height:56px;font-size:12px;font-weight:600;color:var(--ink2)}
    .tabbar button.on{color:var(--g900);font-weight:800;box-shadow:inset 0 3px 0 var(--g900)}
    .tabbar .nb{position:absolute;top:4px;left:calc(50% + 6px);height:18px;min-width:18px;font-size:10px}
    .mhead{display:flex;justify-content:space-between;align-items:center;margin:-16px -16px 14px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
    .mhead .b{font-size:11px;font-weight:700;color:var(--g600)}
    h2{font-size:20px}
    .guide{grid-template-columns:1fr}
    .mlist{flex-direction:row;flex-wrap:wrap}
    .cal .day{min-height:56px;padding:3px}
    .cal .ev{display:none}
    .cal .day .dot{display:block}
    .grid2{grid-template-columns:1fr}
    .btn{min-height:var(--tap)} .btn.sm{min-height:36px}
    .modal{align-items:flex-end;padding:0}
    .sheet{max-width:none;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 16px 24px;max-height:92vh;overflow:auto}
    .sheet::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 12px}
  }
  @media (min-width:901px){ .mhead{display:none} }
  /* 640px 이하: 표 → 카드 (th 이름을 각 칸 앞에 붙임) */
  @media (max-width:640px){
    .stats{grid-template-columns:1fr 1fr}
    .stat{border-bottom:1px solid var(--line)}
    .stat .v{font-size:24px}
    .tbl.cardable thead,.tbl.cardable tr:first-child:has(th){display:none}
    .tbl.cardable,.tbl.cardable tbody,.tbl.cardable tr,.tbl.cardable td{display:block;width:100%}
    .tbl.cardable tr{border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 14px;margin-bottom:8px;background:#fff}
    .tbl.cardable tr.warn,.tbl.cardable tr.bad{background:var(--bad-bg);border-color:var(--bad-line)}
    .tbl.cardable td{border:none;padding:2px 0;text-align:left!important;background:none!important}
    .tbl.cardable td:first-child{font-weight:800;font-size:15px}
    .tbl.cardable td[data-label]:not(:first-child)::before{content:attr(data-label) ' ';color:var(--ink3);font-size:var(--fs-xs);margin-right:6px}
    .tbl.cardable td:empty{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">네이버 전담팀</div>
    <div class="who" id="who"></div>
    <nav id="tabs" aria-label="메뉴"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <div class="mainwrap"><main id="view"><div class="loading">불러오는 중…</div></main></div>
</div>
<nav class="tabbar" id="tabbar" aria-label="아래 메뉴"></nav>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><button class="close" aria-label="닫기" onclick="closeModal()">×</button><div id="mbody"></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ───────── 공통 ───────── */
var B = null;            // bootstrap 데이터
var CUR = null;          // 현재 탭
var ST = { taskWho: '', salesGrade: '전체', salesDue: '전체', salesOpen: true, planWho: '', calMonth: '', calWho: '', calDay: '', perfWho: '', guideMedia: '', noticeFilter: '전체' };
var HOUR = 60 * 60 * 1000;

function call(action, payload) {
  return new Promise(function (res, rej) {
    google.script.run
      .withSuccessHandler(function (t) { var r = JSON.parse(t); r.ok ? res(r.data) : rej(new Error(r.error)); })
      .withFailureHandler(function (e) { rej(e); })
      .api(action, payload || {});
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function isLead() { return B && B.me.role === 'lead'; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, err ? 5000 : 2200); }
function fail(e) { toast(e && e.message ? e.message : String(e), true); }
function openModal(html, wide) { $('modal').querySelector('.sheet').style.maxWidth = wide ? '980px' : ''; $('mbody').innerHTML = html; $('modal').hidden = false; var f = $('mbody').querySelector('input,select,textarea,button'); if (f) f.focus(); }
function closeModal() { $('modal').hidden = true; $('mbody').innerHTML = ''; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });
function val(id) { var el = $(id); return el ? el.value : ''; }
function opts(list, cur) { return list.map(function (o) { var v = typeof o === 'string' ? o : o.v, l = typeof o === 'string' ? o : o.l; return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join(''); }

function won(n) {
  n = Math.round(Number(n) || 0); var s = n < 0 ? '-' : ''; n = Math.abs(n);
  if (n >= 1e8) { var man = Math.round((n % 1e8) / 1e4); return s + Math.floor(n / 1e8) + '억' + (man ? ' ' + man.toLocaleString() + '만' : ''); }
  if (n >= 1e4) return s + Math.round(n / 1e4).toLocaleString() + '만';
  return s + n.toLocaleString() + '원';
}
function num(n) { n = Number(n) || 0; return Number.isInteger(n) ? n.toLocaleString() : (Math.round(n * 10) / 10).toLocaleString(); }
function amt(n, unit) { return unit === '원' ? won(n) : num(n) + (unit || ''); }
function chg(cur, prev) {
  if (!prev) return '<span class="muted">비교 없음</span>';
  var p = (cur / prev - 1) * 100, c = p >= 0 ? 'up' : 'down';
  return '<span class="' + c + '">' + (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toFixed(1) + '%</span>';
}
function md(s) { return s ? Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)) : ''; }
function addDays(s, n) { var a = s.split('-').map(Number); var d = new Date(Date.UTC(a[0], a[1] - 1, a[2] + n)); return d.toISOString().slice(0, 10); }
function addMonths(m, n) { var a = m.split('-').map(Number); return new Date(Date.UTC(a[0], a[1] - 1 + n, 1)).toISOString().slice(0, 7); }
function linkify(s) { return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function memberOpts(cur, withAll) { var l = withAll ? [{ v: '', l: '팀원 전체' }] : []; B.members.forEach(function (m) { l.push({ v: m.email, l: m.name + (m.role === 'lead' ? ' (팀장)' : '') }); }); return opts(l, cur); }

/* ───────── 시작 ───────── */
function start() {
  call('bootstrap').then(function (d) {
    B = d;
    var dd = new Date(d.today + 'T00:00:00Z');
    $('who').innerHTML = '<span><b>' + esc(d.me.name) + '</b> 님</span><span class="role">' + (isLead() ? '팀장' : '팀원') + '</span>'
      + '<span>' + esc(d.today.slice(5)) + ' (' + '일월화수목금토'[dd.getUTCDay()] + ')</span>';
    $('sidefoot').innerHTML = '<button class="linkbtn" onclick="alertSetup()">알리미 연결</button>';
    drawTabs();
    google.script.url.getLocation(function (loc) {
      var want = loc.parameter && loc.parameter.tab;
      if (loc.parameter && loc.parameter.lead) { ST.openLead = loc.parameter.lead; ST.salesOpen = false; want = 'sales'; }
      var first = (want && B.tabs.some(function (t) { return t.id === want; })) ? want : (store('ob-tab') || B.tabs[0].id);
      if (!B.tabs.some(function (t) { return t.id === first; })) first = B.tabs[0].id;
      go(first);
      nudge(true);
    });
    setInterval(function () { nudge(false); }, HOUR);
  }).catch(function (e) {
    $('view').innerHTML = '<div class="fatal">' + esc(e.message || e) + '</div>';
  });
}

/* 메뉴: PC 왼쪽 4묶음(오늘·성과·자료·팀장 전용), 모바일 아래 5칸(점검·할일·영업노트·실적·더보기) */
var NAV_GROUPS = [['오늘', ['check', 'task', 'sales', 'calendar']], ['성과', ['perf', 'plan']], ['자료', ['notice', 'solution', 'guide']]];
var NAV_SHORT = { check: '점검', task: '할일', sales: '영업노트', perf: '실적', plan: '액션플랜', calendar: '캘린더', notice: '공지', solution: '솔루션', guide: '가이드', admin: '팀 현황' };
function navBadges() {
  var b = B.badges || {};
  // 빨강 = 오늘 손댈 것, 연초록 = 남은 개수, 0이면 숨김
  return { sales: [b.calls, true], task: [b.todo, false], notice: [b.unread, false], plan: [isLead() ? (b.pending || 0) + (b.talk || 0) : 0, true] };
}
function nb(x) { return x && x[0] ? '<span class="nb' + (x[1] ? ' red' : '') + '">' + x[0] + '</span>' : ''; }
function drawTabs() {
  var cnt = navBadges(), has = {};
  B.tabs.forEach(function (t) { has[t.id] = t; });
  var item = function (id) {
    var t = has[id]; if (!t) return '';
    return '<button class="nav-item' + (id === CUR ? ' on' : '') + (t.lead ? ' lead' : '') + '" onclick="go(\'' + id + '\')">' + esc(t.name) + nb(cnt[id]) + '</button>';
  };
  var used = {};
  var h = NAV_GROUPS.map(function (g) { g[1].forEach(function (id) { used[id] = 1; }); return '<div class="nav-group">' + g[0] + '</div>' + g[1].map(item).join(''); }).join('');
  var rest = B.tabs.filter(function (t) { return !used[t.id] && !t.lead; }).map(function (t) { return item(t.id); }).join('');
  var lead = B.tabs.filter(function (t) { return t.lead; });
  h += rest + (lead.length ? '<div class="nav-sep"></div><div class="nav-group">팀장 전용</div>' + lead.map(function (t) { return item(t.id); }).join('') : '');
  $('tabs').innerHTML = h;
  var bottom = ['check', 'task', 'sales', 'perf'].filter(function (id) { return has[id]; });
  var inMore = B.tabs.filter(function (t) { return bottom.indexOf(t.id) < 0; });
  var moreN = inMore.reduce(function (s, t) { var c = cnt[t.id]; return s + (c && c[1] ? c[0] || 0 : 0); }, 0);
  $('tabbar').innerHTML = bottom.map(function (id) {
    return '<button class="' + (id === CUR ? 'on' : '') + '" onclick="go(\'' + id + '\')">' + NAV_SHORT[id] + nb(cnt[id]) + '</button>';
  }).join('') + '<button class="' + (CUR === 'more' || bottom.indexOf(CUR) < 0 ? 'on' : '') + '" onclick="go(\'more\')">더보기' + nb([moreN, true]) + '</button>';
}
/** 모바일 '더보기': 아래 탭에 없는 메뉴 목록 */
function viewMore() {
  var cnt = navBadges(), bottom = ['check', 'task', 'sales', 'perf'];
  $('view').innerHTML = '<div class="head"><div><h2>더보기</h2></div></div><div class="more-list">' + B.tabs.filter(function (t) { return bottom.indexOf(t.id) < 0; }).map(function (t) {
    return '<button class="nav-item' + (t.lead ? ' lead' : '') + '" onclick="go(\'' + t.id + '\')">' + esc(t.name) + nb(cnt[t.id]) + '</button>';
  }).join('') + '</div><p class="small muted" style="margin-top:14px"><button class="linkbtn" onclick="alertSetup()">알리미 연결</button></p>';
}
/** 화면을 그린 뒤 표에 칸 이름을 붙여 모바일에서 카드로 보이게 */
function cardify(root) {
  [].forEach.call((root || document).querySelectorAll('table.tbl:not(.cardable)'), function (t) {
    var head = t.querySelector('tr'); if (!head || !head.querySelector('th')) return;
    var names = [].map.call(head.children, function (c) { return c.textContent.trim(); });
    [].forEach.call(t.querySelectorAll('tr'), function (tr, i) {
      if (i === 0) return;
      [].forEach.call(tr.children, function (td, j) { if (names[j]) td.setAttribute('data-label', names[j]); });
    });
    t.classList.add('cardable');
  });
}
if (window.MutationObserver) new MutationObserver(function () { cardify($('view')); cardify($('mbody')); }).observe(document.body, { childList: true, subtree: true });

function go(id) {
  CUR = id; store('ob-tab', id); drawTabs();
  $('view').innerHTML = '<div class="loading">불러오는 중…</div>';
  if (id !== 'more' && window.scrollTo) try { window.scrollTo(0, 0); } catch (e) {}
  ({ more: viewMore, perf: viewPerf, check: viewCheck, plan: viewPlan, sales: viewSales, task: viewTask, notice: viewNotice, solution: viewSolution, guide: viewGuide, calendar: viewCalendar, admin: viewAdmin }[id] || viewPlan)();
}
function refreshBadges() { return call('badges').then(function (b) { B.badges = b; drawTabs(); return b; }); }

/** 보드를 열어둔 동안: 미확인 공지는 1시간마다, 오늘 할 일은 하루 한 번 팝업 */
function nudge(first) {
  (first ? Promise.resolve(B.badges) : refreshBadges()).then(function (b) {
    if (b.unread) return noticePopup();
    if (first && (b.todo || b.calls) && store('ob-todo') !== B.today) { store('ob-todo', B.today); todayPopup(); }
  }).catch(function () {});
}

/* ───────── 오늘 묶음 (오늘 전화할 곳 + 오늘 할일 + 오늘 목표) ───────── */
function todayPopup() {
  call('today').then(function (t) {
    var goals = t.goals.filter(function (g) { return !g.checked; });
    if ((!t.calls.length && !t.tasks.length && !goals.length) || !$('modal').hidden) return;
    var dd = new Date(B.today + 'T00:00:00Z');
    openModal('<p class="small" style="color:var(--g600);font-weight:700">' + Number(B.today.slice(5, 7)) + '월 ' + Number(B.today.slice(8)) + '일 ' + '일월화수목금토'[dd.getUTCDay()] + '요일</p><h3>오늘 할 일</h3><div style="height:10px"></div>'
      + todayBody(t, goals)
      + '<div class="row" style="justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)"><label class="small muted"><input type="checkbox" onchange="store(\'ob-todo\',this.checked?B.today:\'\')" checked> 오늘은 다시 열지 않기</label>'
      + '<button class="btn pri" onclick="closeModal();go(\'check\')">오늘 점검 보기</button></div>', true);
  }).catch(function () {});
}
function todayBody(t, goals) {
  var h = '';
  if (t.calls.length) h += '<h3 class="small" style="margin:6px 0">📞 오늘 연락할 곳 ' + t.calls.length + '곳</h3>' + t.calls.map(function (c) {
    return '<div class="todo-row' + (c.overdue ? ' late' : '') + '"><b>' + esc(c.at.slice(11, 16) || '시간 미정') + '</b> ' + esc(c.company)
      + (c.overdue ? ' <span class="tag bad">지남</span>' : '') + (c.memo ? '<div class="muted small">' + esc(c.memo) + '</div>' : '')
      + '<div class="row" style="margin-top:4px"><button class="btn ok sm" onclick="closeModal();openLead(\'' + c.id + '\')">영업노트에서 보기</button>'
      + (c.phone ? '<a class="btn ghost sm" href="tel:' + esc(c.phone) + '">' + esc(c.phone) + '</a>' : '') + '</div></div>';
  }).join('');
  if (t.tasks.length) h += '<h3 class="small" style="margin:12px 0 6px">✅ 오늘 할일 ' + t.tasks.length + '개</h3>' + t.tasks.map(function (x) {
    return '<label class="todo-row row"><input type="checkbox" onchange="taskDone(\'' + x.id + '\',this.checked,true)"> <span class="tag ' + (x.kind === '영업' ? 'blue' : 'gray') + '">' + esc(x.kind) + '</span> '
      + (x.time ? '<b>' + esc(x.time) + '</b> ' : '') + (x.company ? '<b>' + esc(x.company) + '</b> · ' : '') + esc(x.title) + (x.overdue ? ' <span class="tag bad">밀림</span>' : '') + '</label>';
  }).join('');
  if (goals.length) h += '<h3 class="small" style="margin:12px 0 6px">🎯 오늘 목표 기준량</h3>' + goals.map(function (g) {
    return '<div class="todo-row"><span class="tag">' + esc(g.period) + '</span> ' + esc(g.title) + ' · 오늘 <b>' + esc(g.daily) + esc(g.unit || '') + '</b></div>';
  }).join('');
  return h;
}

/* ───────── 할일 (관리 / 영업) ───────── */
function taskSection(tasks, who) {
  var mine = !isLead() || !who || who === B.me.email;
  var col = function (kind) {
    var list = tasks.filter(function (t) { return t.kind === kind; });
    return '<div class="card"><div class="ct" style="justify-content:space-between"><span class="t">' + kind + '</span>'
      + (mine ? '<button class="btn sm" onclick="taskForm(null,\'' + kind + '\')">+ 추가</button>' : '') + '</div>'
      + (list.length ? list.map(function (t) {
        return '<div class="task' + (t.done ? ' done' : '') + (t.overdue ? ' late' : '') + '">'
          + (mine && t.email === B.me.email && (t.today || t.repeat === '없음') ? '<input type="checkbox"' + (t.done ? ' checked' : '') + ' onchange="taskDone(\'' + t.id + '\',this.checked)" aria-label="완료">' : '<span class="dotk"></span>')
          + '<div class="tb"><div>' + (t.time ? '<b>' + esc(t.time) + '</b> ' : '') + (t.company ? '<span class="co">' + esc(t.company) + '</span> ' : '') + esc(t.title) + (isLead() && !who ? ' <span class="muted small">' + esc(t.who) + '</span>' : '') + '</div>'
          + '<div class="muted small">' + repeatText(t) + (t.overdue ? ' · <span class="down">밀림</span>' : '') + (t.memo ? ' · ' + esc(t.memo) : '') + '</div></div>'
          + (mine || isLead() ? '<button class="linkbtn small" onclick="taskForm(\'' + t.id + '\')">수정</button>' : '') + '</div>';
      }).join('') : '<p class="muted small">아직 없어요.' + (mine ? ' 매일·매주 반복할 일도 넣을 수 있어요.' : '') + '</p>') + '</div>';
  };
  return '<div class="sec"><h3>할일 <span class="muted small">직접 쓰는 업무 목록 · 승인 없이 바로 사용</span></h3><div class="grid2 tasks">' + col('관리') + col('영업') + '</div></div>';
}
function repeatText(t) {
  if (t.repeat === '없음') return (t.due ? md(t.due) + '까지' : '한 번');
  if (t.repeat === '매주') return '매주 ' + esc(t.repeatValue);
  if (t.repeat === '매월') return '매월 ' + esc(t.repeatValue) + '일';
  return esc(t.repeat);
}
function taskForm(id, kind) {
  var t = id ? (window._tasks || []).find(function (x) { return x.id === id; }) : { kind: kind || '관리', title: '', company: '', memo: '', repeat: '없음', repeatValue: '', due: B.today, time: '' };
  var days = (t.repeatValue || '').split(',');
  openModal('<h3>' + (id ? '할일 수정' : '할일 추가') + '</h3>'

}

/** 일일점검 화면(dashboard.html)을 원보드 색·표 모양으로 덮어씀(원본 파일은 그대로) */

/** 본문 속 ⟦화면 N · 설명⟧ 자리에 화면이 들어갑니다(2팀 가이드처럼 글 사이에 화면) */
function shotMarks(h) {
  return h.replace(/⟦화면 (\d+) · ([^⟧]*)⟧/g, function (_, n, cap) {
    return '<figure class="shot" data-n="' + n + '"><div class="shotph">📷 화면 불러오는 중… ' + cap + '</div><figcaption class="small muted">' + cap + '</figcaption></figure>';
  });
}
function shotHtml(it, i) {
  return '<a href="' + it.src + '" target="_blank" rel="noopener" title="크게 보기"><img src="' + it.src + '" alt="' + esc(it.cap) + '" loading="lazy"></a>';
}
/** 화면 묶음을 불러와 본문 자리에 넣고, 자리가 없는 화면(단계별 따라하기)은 설명과 함께 아래에 붙입니다 */
function guideShots(id) {
  var g = (window._guides || []).find(function (x) { return x.id === id; }) || {};
  var box = $('gs-' + id);
  if (box) box.innerHTML = '<span class="muted small">화면을 불러오는 중… (' + (g.images || '') + '장)</span>';
  window._shotCache = window._shotCache || {};
  var got = window._shotCache[id] ? Promise.resolve(window._shotCache[id]) : call('guideImages', { id: id });
  got.then(function (d) {
    window._shotCache[id] = d; // 한 번 본 화면은 다시 내려받지 않음
    var items = d.items || [], body = $('gb-' + id);
    var used = {};
    if (body) [].forEach.call(body.querySelectorAll('figure.shot[data-n]'), function (f) {
      var i = Number(f.getAttribute('data-n')) - 1, it = items[i];

    var rest = items.map(function (it, i) { return used[i] ? '' : '<figure class="shot"><figcaption><b>' + (i + 1) + '. ' + esc(it.cap) + '</b>' + (it.text ? '<div>' + esc(it.text) + '</div>' : '') + (it.tip ? '<div class="tip">💡 ' + esc(it.tip) + '</div>' : '') + '</figcaption>' + shotHtml(it, i) + '</figure>'; }).join('');
    if (box) box.innerHTML = rest ? '<h4 style="margin:6px 0 10px">광고센터 화면으로 따라하기</h4>' + rest : '';
  }).catch(function (e) { if (box) box.innerHTML = ''; fail(e); });
}

      var ups = acc.filter(function (a) { return a.mtd > a.prevMtd; }).slice(0, 10);

      h += fold('계정별 매출 변화', '줄어든 ' + drops.length + '곳 · 늘어난 ' + acc.filter(function (a) { return a.mtd > a.prevMtd; }).length + '곳' + (worst ? ' · 가장 크게 준 곳 <b class="down">' + esc(worst.name) + ' ' + chg(worst.mtd, worst.prevMtd) + '</b>' : ''),
        '<p class="muted small" style="margin:0 0 10px">이번 달 누적을 지난달 같은 기간과 비교합니다.</p><div class="cols">' + accTable('많이 줄어든 계정', drops.slice(0, 15)) + accTable('많이 늘어난 계정', ups) + '</div>'
        + '<details><summary>전체 계정 ' + acc.length + '곳 보기</summary>' + accTable('', acc.slice().sort(function (a, b) { return b.mtd - a.mtd; })) + '</details>');
    }
    if (d.months && d.months.media.length) {
      var mm = d.months.media.filter(function (r) { return d.months.has[0] && d.months.has[2]; });
      var upN = mm.filter(function (r) { return r.amts[2] >= r.amts[0]; }).length;
      var top = mm.slice().sort(function (a, b) { return (b.amts[0] ? b.amts[2] / b.amts[0] : 0) - (a.amts[0] ? a.amts[2] / a.amts[0] : 0); })[0];
      h += fold('최근 3개월 흐름', mm.length ? d.months.media.length + '개 매체 중 ' + upN + '개 증가' + (top ? ' · ' + esc(top.media) + ' ' + chg(top.amts[2], top.amts[0]) : '') : '매체별 월 매출', unsec(monthsBlock(d.months)));
    }
    if (d.ahi) {
      var w = d.ahi.metrics.filter(function (m) { return m.warn; });
      h += fold('AHI 건강 신호', Number(d.ahi.month.slice(5)) + '월 마감 기준 · ' + (w.length ? '나빠진 지표 <b class="down">' + w.length + '개 (' + esc(w[0].label) + ')</b>' : '<span class="up">나빠진 지표 없음</span>'), unsec(ahiBlock(d.ahi)));
    }
    $('view').innerHTML = h;
  }).catch(fail);
}
/** 요약 한 줄 → 펼치기 */
function fold(title, sum, inner) {
  return '<details class="fold"><summary><b>' + title + '</b><span class="sum">' + sum + '</span><span class="open">펼치기</span></summary><div class="in">' + inner + '</div></details>';
}
function unsec(h) { return h.replace(/^<div class="sec"><h3>[\s\S]*?<\/h3>/, '<div>'); }
function dow(d) { return '(' + '일월화수목금토'[new Date(d + 'T00:00:00Z').getUTCDay()] + ')'; }
/** 최근 3개월 흐름: 지난 3개월 + 이번 달 누적, 매체별 막대 */
function monthsBlock(m) {
  var max = 1; m.media.forEach(function (r) { r.amts.forEach(function (a) { max = Math.max(max, a); }); });
  var lab = m.months.map(function (x, i) { return Number(x.slice(5)) + '월' + (i === 3 ? '(누적)' : ''); });
  return '<div class="sec"><h3>최근 3개월 흐름</h3><p class="muted small" style="margin:-6px 0 10px">매체별 월 매출. 이번 달은 어제까지 누적입니다.</p><div class="scroll"><table class="tbl"><tr><th>매체</th>'
    + lab.map(function (l) { return '<th class="r">' + l + '</th>'; }).join('') + '<th>흐름</th><th class="r">3개월 전 → 지난달</th></tr>'
    + m.media.map(function (r) {
      var bars = r.amts.map(function (a, i) { var hh = Math.max(1, Math.round(a / max * 28)); return '<rect x="' + (i * 16) + '" y="' + (30 - hh) + '" width="12" height="' + hh + '" rx="2" fill="' + (i === 3 ? '#9fd3b6' : '#25935f') + '"/>'; }).join('');
      return '<tr><td><b>' + esc(r.media) + '</b></td>' + r.amts.map(function (a, i) { return '<td class="r">' + (m.has[i] ? won(a) : '<span class="muted">-</span>') + '</td>'; }).join('')
        + '<td><svg width="64" height="30" viewBox="0 0 64 30">' + bars + '</svg></td><td class="r">' + (m.has[0] && m.has[2] ? chg(r.amts[2], r.amts[0]) : '<span class="muted">-</span>') + '</td></tr>';
    }).join('') + '</table></div></div>';
}
function accTable(title, list) {
  return '<div>' + (title ? '<h3 class="small muted">' + title + '</h3>' : '') + '<div class="scroll"><table class="tbl"><tr><th>광고주</th><th class="r">이번 달</th><th class="r">지난달 같은 기간</th><th class="r">증감</th></tr>'
    + (list.length ? list.map(function (a) { return '<tr><td>' + esc(a.name) + ' <span class="muted small">' + esc(a.media) + '</span></td><td class="r">' + won(a.mtd) + '</td><td class="r">' + won(a.prevMtd) + '</td><td class="r">' + chg(a.mtd, a.prevMtd) + '</td></tr>'; }).join('') : '<tr><td colspan="4" class="muted">없음</td></tr>')
    + '</table></div></div>';
}
function trendSvg(t) {
  if (!t.length) return '';
  var amts = t.map(function (x) { return x.amt; });
  var tot = amts.reduce(function (a, b) { return a + b; }, 0), avg = tot / t.length;
  var top = t.reduce(function (m, x) { return x.amt > m.amt ? x : m; }, t[0]);
  var last7 = amts.slice(-7).reduce(function (a, b) { return a + b; }, 0) / Math.min(7, t.length);
  var prev7 = amts.length >= 14 ? amts.slice(-14, -7).reduce(function (a, b) { return a + b; }, 0) / 7 : 0;
  // 눈금: 보기 좋은 단위로 올림
  var raw = Math.max.apply(null, amts.concat([1])), step = Math.pow(10, Math.floor(Math.log10(raw / 3)));
  [1, 2, 2.5, 5, 10].some(function (m) { if (raw / (step * m) <= 4) { step *= m; return true; } return false; });
  var max = Math.ceil(raw / step) * step;
  var L = 58, R = 12, T = 22, B = 34, W = 960, H = 260, pw = W - L - R, ph = H - T - B, bw = pw / t.length;
  var y = function (v) { return T + ph - v / max * ph; };
  var g = '';
  for (var v = 0; v <= max + 1; v += step) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e6eee9"/>'
    + '<text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" font-size="11" text-anchor="end" fill="#86978e">' + (v ? won(v) : '0') + '</text>';
  var bars = t.map(function (x, i) {
    var d = new Date(x.date + 'T00:00:00Z').getUTCDay(), we = d === 0 || d === 6, lastBar = i === t.length - 1;
    var h = Math.max(x.amt ? 2 : 0, x.amt / max * ph), cx = L + i * bw + bw / 2;
    return '<g class="tb-bar"><title>' + md(x.date) + ' (' + '일월화수목금토'[d] + ') ' + Math.round(x.amt).toLocaleString() + '원</title>'
      + '<rect x="' + (L + i * bw) + '" y="' + T + '" width="' + bw + '" height="' + ph + '" fill="transparent"/>'
      + '<rect x="' + (L + i * bw + bw * 0.18) + '" y="' + (T + ph - h) + '" width="' + (bw * 0.64) + '" height="' + h + '" rx="3" fill="' + (lastBar ? '#0f3d2c' : we ? '#c5e3d1' : '#25935f') + '"/>'
      + (lastBar ? '<text x="' + cx + '" y="' + (T + ph - h - 6) + '" font-size="12" font-weight="700" text-anchor="middle" fill="#0f3d2c">' + won(x.amt) + '</text>' : '')
      + (d === 1 || lastBar ? '<text x="' + cx + '" y="' + (H - B + 16) + '" font-size="11" text-anchor="middle" fill="#4b5f55">' + md(x.date) + '</text>' : '')
      + (d === 1 ? '<text x="' + cx + '" y="' + (H - B + 29) + '" font-size="10" text-anchor="middle" fill="#86978e">월</text>' : '') + '</g>';
  }).join('');
  var avgLine = '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(avg) + '" y2="' + y(avg) + '" stroke="#c2410c" stroke-dasharray="5 4" stroke-width="1.5"/>'
    + '<text x="' + (L + 6) + '" y="' + (y(avg) - 6) + '" font-size="11" text-anchor="start" fill="#c2410c" paint-order="stroke" stroke="#fff" stroke-width="3">30일 평균 ' + won(avg) + '</text>';
  var kp = function (l, v, d) { return '<div class="tk"><span class="muted small">' + l + '</span><b>' + v + '</b>' + (d ? '<span class="small">' + d + '</span>' : '') + '</div>'; };
  return '<div class="ct" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><span class="t">최근 30일 일별 매출</span><span class="muted small">막대에 마우스를 올리면 금액 · 연한 막대 = 주말</span></div>'
    + '<div class="tkeys">' + kp('30일 합계', won(tot)) + kp('하루 평균', won(avg)) + kp('최근 7일 평균', won(last7), prev7 ? chg(last7, prev7) + ' <span class="muted">그 전 7일</span>' : '')
    + kp('가장 많은 날', won(top.amt), '<span class="muted">' + md(top.date) + '</span>') + '</div>'
    + '<svg class="trend" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="최근 30일 일별 매출 막대그래프">' + g + bars + avgLine + '</svg>';
}
function ahiBlock(a) {
  var warns = a.metrics.filter(function (m) { return m.warn; });
  var h = '<div class="sec"><h3>AHI 건강 신호 <span class="muted small">' + Number(a.month.slice(5)) + '월 마감 기준 · ' + Number(a.prevMonth.slice(5)) + '월과 비교</span></h3>'
    + '<p class="muted small" style="margin:-6px 0 12px">점수 구간표 없이, AHI를 만드는 원재료 지표가 전월보다 나빠졌는지만 봅니다. 주황색 칸이 먼저 챙길 곳이고, 비중이 큰 축부터 보여줍니다.</p>';
  if (warns.length) h += '<div class="pop"><b>' + warns.map(function (m) { return m.axis + '·' + m.label; }).join(', ') + '</b> 이(가) 떨어지고 있어요. AHI가 내려갈 수 있는 신호입니다.</div>';
  h += '<div class="ahi">' + a.metrics.map(function (m) {
    var v = m.cur === null ? '<span class="muted" style="font-size:15px">계산 불가</span>' : num(m.cur) + '<span style="font-size:14px">' + m.unit + '</span>';
    var dl = m.delta === null ? '' : (function () { var good = m.good === 'up' ? m.delta >= 0 : m.delta <= 0; return '<span class="' + (good ? 'up' : 'down') + '">' + (m.delta >= 0 ? '▲' : '▼') + ' ' + Math.abs(m.delta) + m.deltaUnit + '</span>'; })();
    return '<div class="ax' + (m.warn ? ' warn' : '') + '"><div class="top2"><span>' + m.axis + ' 축 · 비중 ' + m.weight + '%</span>' + (m.warn ? '<span class="tag warn">주의</span>' : '') + '</div>'
      + '<div class="nm">' + m.label + '</div><div class="row"><span class="v">' + v + '</span>' + dl + '</div><div class="h">' + esc(m.note || m.hint) + '</div></div>';
  }).join('') + '</div>';
  if (a.lost.length) h += '<details><summary>지난달엔 집행했는데 이번 달 멈춘 계정 ' + a.lost.length + '곳</summary><table class="tbl small">' + a.lost.map(function (l) { return '<tr><td>' + esc(l.name) + '</td><td>' + esc(l.media) + '</td><td class="r">' + won(l.prev) + '</td></tr>'; }).join('') + '</table></details>';
  h += '<p class="muted small" style="margin-top:8px">이력이 3~6개월 이상 쌓여야 계산되는 지표가 있습니다. 데이터 시작: ' + esc(a.dataStart) + '</p></div>';
  return h;
}

/* ───────── 팀 현황 (팀장) ───────── */
function viewAdmin() {
  var month = ST.adminMonth || B.today.slice(0, 7);
  Promise.all([call('teamStats', { month: month }), call('usageStats', { month: month })]).then(function (r) {
    var d = r[0], u = r[1];
    var h = '<div class="head"><div><h2>팀 현황</h2><p>팀장만 보는 화면입니다. 달성과 실패가 어디에 몰리는지 보고 팀원별로 관리 방식을 정하세요.</p></div>'
      + '<div class="row"><input type="month" style="width:auto" value="' + month + '" onchange="ST.adminMonth=this.value;viewAdmin()"></div></div>'
      + (function () {
        var talk = d.members.reduce(function (t, m) { return t + (m.talkPending || 0); }, 0), pend = d.members.reduce(function (t, m) { return t + (m.pending || 0); }, 0);
        var low = d.members.filter(function (m) { return m.rate !== null && m.rate < 60; });
        return '<div class="todo-strip"><button class="ts' + (talk ? ' bad' : '') + '" onclick="go(\'plan\')"><b>' + talk + '</b>소통 대기</button><button class="ts' + (pend ? ' warn' : '') + '" onclick="go(\'plan\')"><b>' + pend + '</b>승인 대기</button>'
          + '<div class="ts' + (low.length ? ' warn' : '') + '"><b>' + low.length + '</b>달성 비율 60% 미만' + (low.length ? ' · ' + low.map(function (m) { return esc(m.name); }).join(', ') : '') + '</div></div>';
      })()
      + (d.kick ? '<p class="small ' + (d.kick.token ? 'muted' : 'down') + '" style="margin:-6px 0 12px">자동 수집 실행: ' + (d.kick.token ? (d.kick.last ? '마지막 ' + esc(d.kick.last) : '토큰 연결됨, 다음 시각에 실행') : '설정 탭에 깃허브토큰을 넣으면 정해진 시각에 오늘 점검·인트라넷 수집이 실행됩니다') + '</p>' : '')
      + '<div class="scroll"><table class="tbl"><tr><th>팀원</th><th class="r">달성</th><th class="r">실패</th><th class="r">달성 비율</th><th class="r">소통 대기</th><th class="r">승인 대기</th><th class="r">진행 목표</th><th class="r">미확인 공지</th><th>마지막 체크</th><th>알리미</th><th></th></tr>'
      + d.members.slice().sort(function (a, b) { return ((b.talkPending || 0) + (b.pending || 0) + (b.rate !== null && b.rate < 60 ? 1 : 0)) - ((a.talkPending || 0) + (a.pending || 0) + (a.rate !== null && a.rate < 60 ? 1 : 0)); }).map(function (m) {
        var hot = m.rate !== null && m.rate < 60;
        return '<tr' + (hot ? ' class="warn"' : '') + '><td><b>' + esc(m.name) + '</b></td><td class="r up">' + m.ok + '</td><td class="r down">' + m.fail + '</td><td class="r">' + (m.rate === null ? '-' : m.rate + '%') + '</td>'
          + '<td class="r">' + (m.talkPending || '') + '</td><td class="r">' + (m.pending || '') + '</td><td class="r">' + m.active + '</td><td class="r">' + (m.unread ? '<span class="down">' + m.unread + '</span>' : '0') + '</td>'
          + '<td>' + (m.lastCheck ? md(m.lastCheck) : '<span class="muted">없음</span>') + '</td><td>' + (m.hasAlert ? '<span class="tag">연결</span>' : '<span class="tag gray">미연결</span>') + '</td>'
          + '<td><button class="btn sm ghost" onclick="evalForm(\'' + m.email + '\')">평가자료</button></td></tr>';
      }).join('') + '</table></div>'
      + '<p class="muted small" style="margin-top:8px">달성 비율이 60% 미만이면 주황색으로 표시합니다. 팀원 추가·삭제와 담당자명은 원보드 시트의 <code>팀원</code> 탭에서 바꿉니다.</p>'
      + usageBlock(u)
      + '<div class="sec"><h3>팀장 전용 메뉴 늘리기</h3><p class="muted small">관리자 회의록 요약 같은 팀장 전용 탭은 코드의 <code>TABS</code> 목록에 한 줄을 추가하면 이 탭처럼 팀장에게만 보입니다.</p></div>';
    $('view').innerHTML = h;
  }).catch(fail);
}

/* ───────── 알리미 연결 ───────── */
function alertSetup(renew) {
  call('alertCode', { renew: !!renew }).then(function (d) {
    openModal('<h3>원보드 알리미 연결</h3><p class="muted small" style="margin:6px 0 12px">알리미(크롬 확장)를 설치하면 보드 창을 닫아도, 크롬이 켜져 있는 동안 공지 미확인 알림이 1시간마다, 오늘 할 일 알림이 아침에 뜹니다.</p>'
      + '<ol class="small" style="padding-left:18px;color:var(--ink2)"><li>팀장에게 받은 알리미 폴더를 크롬 <code>chrome://extensions</code> 에서 <b>압축해제된 확장 프로그램 로드</b>로 설치</li><li>알리미 아이콘 → <b>연결 코드</b>에 아래 코드를 붙여넣고 저장</li></ol>'
      + '<label class="f" style="margin-top:12px"><span>내 연결 코드 (다른 사람에게 주지 마세요)</span><input type="text" id="a_code" readonly value="' + esc(d.connect) + '" onclick="this.select()"></label>'
      + '<div class="actions"><button class="btn ghost" onclick="if(confirm(\'새 코드를 만들면 기존 연결은 끊깁니다. 계속할까요?\'))alertSetup(true)">새 코드 만들기</button><button class="btn pri" onclick="copyCode()">코드 복사</button></div>');
  }).catch(fail);
}
function copyCode() { var i = $('a_code'); i.select(); try { document.execCommand('copy'); toast('복사했어요'); } catch (e) { toast('직접 선택해서 복사하세요', true); } }

start();
</script>
