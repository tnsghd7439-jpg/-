# 원보드 인트라넷 보충 — 매일 오전 11:10(한국시간) MP AI에 없는 매체(11번가·카카오·에이블리)를 인트라넷에서 보충합니다.
# 보충할 매체가 모두 MP AI로 옮겨지면 이 워크플로를 꺼도 됩니다(Actions → board-sync → Disable workflow).
# Claude 를 쓰지 않으므로 크레딧이 들지 않습니다.
# 필요한 저장소 Secrets: MP_ID, MP_PW, BOARD_URL, BOARD_TOKEN
# 공개 저장소의 실행 기록은 누구나 볼 수 있으므로, 스크립트는 건수만 출력합니다.
name: board-sync
# 실행 시각: 원보드(앱스 스크립트)가 설정 탭 '자동실행' 시각(11:10)에 workflow_dispatch 로 실행시킵니다.
# GitHub 예약 실행은 몇 시간씩 밀려서(실측 9시간) 아래 예약은 원보드 요청이 안 될 때를 위한 예비입니다.
on:
  schedule:
    - cron: "10 2 * * *"   # 예비: UTC 02:10 = 한국 11:10
  workflow_dispatch:
    inputs:
      backfill:
        description: "처음 한 번: 최근 62일 + 7개월 이력 채우기"
        type: boolean
        default: false
concurrency:
  group: board-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: python mp_report/board_sync.py ${{ inputs.backfill && '--backfill' || '' }}
        env:
          MP_ID: ${{ secrets.MP_ID }}
          MP_PW: ${{ secrets.MP_PW }}
          BOARD_URL: ${{ secrets.BOARD_URL }}
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
