# 원보드 '오늘 점검' — 6팀 일일점검(네이버 SA 점검)을 회사 PC 없이 매일 아침 수집해 원보드로 보냅니다.
# Claude 를 쓰지 않으므로 크레딧이 들지 않습니다. 조회만 하며 광고 설정은 바꾸지 않습니다.
# 필요한 저장소 Secrets: NAVER_API_KEY, NAVER_SECRET_KEY, NAVER_CUSTOMER_ID, TEAM_JSON, BOARD_URL, BOARD_TOKEN
#   (선택) NAVER_GFA_URL — GFA 시트, NAVER_GCHAT_WEBHOOK + 저장소 변수 BOARD_NOTIFY=1 — 구글챗 공지를 원보드 링크로 보냄
# 공개 저장소의 실행 기록은 누구나 볼 수 있으므로, 스크립트는 건수만 출력합니다.
name: board-sa
on:
  schedule:
    - cron: "40 21 * * *"   # UTC 21:40 = 한국 06:40 (오늘 점검 수집)
    - cron: "40 0 * * 1-5"  # UTC 00:40 = 한국 09:40 (평일 오전 공지 전 갱신)
    - cron: "20 6 * * 1-5"  # UTC 06:20 = 한국 15:20 (평일 오후 공지 전 갱신)
  workflow_dispatch:
jobs:
  sa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
      NAVER_SECRET_KEY: ${{ secrets.NAVER_SECRET_KEY }}
      NAVER_CUSTOMER_ID: ${{ secrets.NAVER_CUSTOMER_ID }}
      NAVER_GFA_URL: ${{ secrets.NAVER_GFA_URL }}
      BOARD_URL: ${{ secrets.BOARD_URL }}
      BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 팀 설정
        env:
          TEAM_JSON: ${{ secrets.TEAM_JSON }}
        run: printf '%s' "$TEAM_JSON" > naver_dash/team.json
      - name: 전날 결과 받기
        run: python naver_dash/board_push.py pull
      - name: 네이버 SA 점검 수집
        run: python naver_dash/collect.py --no-notify > /dev/null
      - name: 원보드로 보내기
        run: python naver_dash/board_push.py push
      - name: 구글챗 공지 (BOARD_NOTIFY=1 일 때만)
        if: vars.BOARD_NOTIFY == '1' && github.event.schedule != '40 21 * * *'
        env:
          NAVER_GCHAT_WEBHOOK: ${{ secrets.NAVER_GCHAT_WEBHOOK }}
          BOARD_LINK: ${{ vars.BOARD_LINK }}
        run: python naver_dash/collect.py --notify-only > /dev/null
